# Servidor gRPC dedicado en el puerto del plugin (la plataforma conecta usePlaintext).
quarkus.grpc.server.use-separate-server=true
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.port=${PLUGIN_GRPC_PORT:50061}

# HTTP (health/metrics) aparte; el contenedor solo expone el puerto gRPC.
quarkus.http.port=8080

# Compresion UPX del binario nativo (igual que platform-app / audit-consumer).
quarkus.native.compression.level=7
