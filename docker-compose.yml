services:
  postgres:
    image: postgres:16-alpine
    container_name: integration-hub-postgres
    environment:
      POSTGRES_DB: bdtrama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      # 5433 en el host para no colisionar con un PostgreSQL nativo de Windows en 5432.
      # La app dev (host) usa localhost:5433; el audit-consumer usa postgres:5432 (red docker).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bdtrama"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: integration-hub-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8180
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/integration-hub-realm.json:/opt/keycloak/data/import/integration-hub-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8180'"]
      interval: 15s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: integration-hub-otel
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: integration-hub-jaeger
    ports:
      - "16686:16686"
      - "14250:14250"

  # Backbone asincrono de auditoria. KRaft (sin Zookeeper). Abierto a otros
  # brokers via el SPI platform.spi.messaging (JMS/RabbitMQ/Redis se suman aqui
  # como servicios adicionales sin tocar productor ni consumidor).
  kafka:
    image: apache/kafka:3.7.0
    container_name: integration-hub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Doble listener: EXTERNAL para la app dev en el host (localhost:9092),
      # INTERNAL para los contenedores en la red de compose (kafka:9094).
      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:9094,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9094,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: integration-hub-kafka-ui
    ports:
      - "8181:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: integration-hub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      kafka:
        condition: service_started

  # Brokers MQ alternativos (enchufables via el SPI). Levantan para cuando se
  # cambie audit.broker.type a RABBITMQ / REDIS / JMS; con Kafka por defecto, son opcionales.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: integration-hub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    container_name: integration-hub-redis
    ports:
      - "6379:6379"

  artemis:
    image: apache/activemq-artemis:2.33.0
    container_name: integration-hub-artemis
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis

  # Store frio columnar opcional para nivel-registro a millones. Se usa cuando
  # audit.cold-store.type=CLICKHOUSE en audit-consumer.
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: integration-hub-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Consumidor de auditoria: deployable independiente (escala/falla aparte del
  # hot-path de pagos). Lee del MQ y registra en audit_event. Requiere
  # `mvn -pl audit-consumer package` previo (layout fast-jar).
  audit-consumer:
    build:
      context: ./audit-consumer
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: integration-hub-audit-consumer
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      # Misma BD que la app dev: el contenedor postgres en la red docker. La app dev
      # llega a esta misma BD por localhost:5433 (puerto publicado), evitando el split-brain.
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/bdtrama
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  postgres_data: