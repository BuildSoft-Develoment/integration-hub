# =====================================================================================
# Integration Hub en UNA VM de Oracle Cloud (Always Free, Ampere A1) — ARM64.
#
# Seis componentes y un proxy. NO es el compose de integracion recortado: hay tres
# diferencias que no son cosmeticas, y estan explicadas donde ocurren.
#
#   1. Keycloak corre en modo PRODUCCION sobre Postgres, no start-dev con H2.
#   2. El TLS lo emite una CA publica (ACME), no un certificado autofirmado.
#   3. Ninguna contrasena tiene valor por defecto.
#
# QUE NO ESTA, Y POR QUE
# Fuera quedan minio, las fuentes sftp/ftp de prueba, los tres plugins de demostracion, el
# widget, el echo y el mock del banco: son andamiaje para ejercitar el motor en local. Un
# servidor expuesto a internet no debe cargar con ellos.
#
# ARQUITECTURA: todas las imagenes de terceros de aqui tienen arm64 —verificado con
# `docker manifest inspect`—. Las DOS propias hay que compilarlas para aarch64: un binario
# nativo de GraalVM NO es portable entre arquitecturas. Se compilan en esta misma VM con
# build-native-arm64.sh; el builder de Mandrel tiene arm64.
#
# OJO CON LA MEMORIA. La documentacion de Oracle da el Always Free de Ampere A1 en horas:
# 1.500 OCPU-hora y 9.000 GB-hora al mes, que dan para ~2 OCPU y ~12 GB funcionando en
# continuo — no los 4 OCPU / 24 GB que se citan por todas partes. Confirmar el limite real en
# la consola del propio tenancy antes de dimensionar.
#
# Importa porque el build nativo pica ~9,3 GB. Con 12 GB entra, pero NO a la vez que la stack:
# hay que pararla antes de compilar. Es el mismo problema que ya tumbo el entorno de
# integracion, donde el build OOM-killeaba servicios aunque `free` mostrase memoria de sobra.
# =====================================================================================
name: integration-hub-cloud

networks:
  ihnet:
    driver: bridge

volumes:
  pg_data:
  kafka_data:
  openbao_data:
  certbot_conf:
  certbot_www:

services:
  # ---------------------------------------------------------------------------------
  # nginx: la unica puerta. App en /appih, Keycloak en /iam, OpenBao en /ui y /v1.
  # ---------------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: ih-nginx
    restart: always
    ports:
      # El 80 NO es decorativo: la CA valida por HTTP-01 contra el y renueva cada 60 dias.
      # Cerrarlo "por seguridad" hace caducar el certificado a los tres meses, y el sintoma
      # llega tarde y disfrazado de fallo del navegador.
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      ihnet:
        aliases:
          # El nombre publico, resoluble DENTRO de la red. Sin esto OpenBao no alcanza a
          # Keycloak por la URL publica y el SSO no se deja ni configurar: exige que la URL
          # que usa sea identica al issuer anunciado.
          - ${PUBLIC_HOST:?falta PUBLIC_HOST en .env (p.ej. app.buildsoft.com.pe)}
    depends_on:
      - platform-app
      - keycloak

  # ---------------------------------------------------------------------------------
  # certbot: emite y RENUEVA. Sin el, el despliegue muere a los 90 dias.
  # Reintenta cada 12h; solo actua si faltan menos de 30 dias, asi que no gasta cuota. Es
  # preferible a un cron del host que nadie recuerda haber creado.
  # ---------------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: ih-certbot
    restart: always
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"]
    networks: [ihnet]

  # ---------------------------------------------------------------------------------
  # Postgres: BD operacional de la plataforma Y de Keycloak (bases separadas).
  # ---------------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ih-postgres
    restart: always
    environment:
      POSTGRES_DB: integration_hub
      POSTGRES_USER: postgres
      # Sin default. En integracion esto caia a "admin"; en una maquina con IP publica un
      # default silencioso es una puerta abierta que nadie recuerda cerrar.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Crea la base de Keycloak al inicializar el volumen. Keycloak NO la crea solo: arranca,
      # no la encuentra y muere con un error de conexion que parece de red.
      - ./postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    networks: [ihnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d integration_hub"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------------
  # Keycloak — MODO PRODUCCION. La diferencia mas importante con integracion, y no es una
  # optimizacion: es correccion.
  #
  # Alli corre start-dev con H2 DENTRO del contenedor. Recrearlo borra usuarios, grupos y
  # todo lo tocado a mano, y reimporta el realm. En local es comodo. Aqui seria perder las
  # cuentas de las personas en cada actualizacion de imagen.
  #
  # El modo `start` exige BD externa y hostname explicito. A cambio, los datos sobreviven.
  # ---------------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: ih-keycloak
    restart: always
    command: ["start", "--import-realm"]
    environment:
      # En modo produccion las variables de arranque del admin son estas, no KEYCLOAK_ADMIN
      # (la pareja de start-dev). Solo crean la PRIMERA cuenta: una vez existe se ignoran, asi
      # que cambiarlas aqui despues no cambia la contrasena de nadie.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?falta KC_ADMIN_USER en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?falta KC_ADMIN_PASSWORD en .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      # TLS lo termina nginx; Keycloak habla HTTP por la red interna.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8180"
      KC_HTTP_RELATIVE_PATH: "/iam"
      KC_PROXY_HEADERS: "xforwarded"
      # Hostname publico INCLUYENDO el subpath: el issuer queda .../iam/realms/... y coincide
      # con lo que valida la app. Con el origen pelado, Keycloak no anade el subpath.
      KC_HOSTNAME: "https://${PUBLIC_HOST:?falta PUBLIC_HOST}/iam"
      KC_HEALTH_ENABLED: "true"
      # Secreto del cliente openbao del realm; Keycloak sustituye los marcadores del JSON de
      # import desde SU entorno.
      #
      # AL EDITAR EL REALM JSON: la sustitucion ocurre en CUALQUIER campo, no solo en secret.
      # Un marcador escrito en description publica el valor ahi, visible en la consola de
      # administracion y en cualquier export. Ya paso una vez. Nombrar la variable sin llaves.
      # Y ese campo es VARCHAR(255): pasarse no trunca, rompe el import entero.
      OPENBAO_OIDC_CLIENT_SECRET: ${OPENBAO_OIDC_CLIENT_SECRET:?falta OPENBAO_OIDC_CLIENT_SECRET en .env}
    volumes:
      - ./keycloak/integration-hub-realm.json:/opt/keycloak/data/import/integration-hub-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    networks: [ihnet]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # bash explicito: /dev/tcp es una extension de bash, no de sh POSIX. Es la forma que ya
      # funciona en el compose de integracion.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8180'"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------------
  # Kafka (KRaft) — NO es opcional, aunque no apareciera en la lista de componentes.
  # El audit-consumer es Kafka puro (@Incoming("audit-in"), connector smallrye-kafka) y el
  # despacho ASINCRONO de tareas de la app tambien. Sin Kafka el consumer no arranca y la
  # mitad del producto —el modo asincrono— no existe.
  # ---------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: ih-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Con volumen persistente los mensajes sobreviven al reinicio. En integracion daba
      # igual; aqui una auditoria perdida por reiniciar un contenedor si importa.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [ihnet]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------------
  # OpenBao — gestor de secretos. Arranca SELLADO y hay que desellarlo a mano tras cada
  # reinicio. No es friccion a eliminar: es la propiedad que lo hace util.
  #
  # Sin certificado montado, a diferencia de integracion: alli el de nginx era autofirmado y
  # OpenBao tenia que confiar en el explicitamente para hablar con Keycloak. Aqui la cadena es
  # de una CA publica y le vale el almacen del sistema. Por eso BAO_OIDC_CA_FILE va VACIO:
  # pasarle el certificado HOJA de una cadena real haria FALLAR la verificacion, no relajarla.
  # ---------------------------------------------------------------------------------
  openbao:
    image: openbao/openbao:2.6.1
    container_name: ih-openbao
    restart: always
    command: ["server", "-config=/openbao/config/config.hcl"]
    environment:
      BAO_API_ADDR: "https://${PUBLIC_HOST:?falta PUBLIC_HOST}"
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./openbao:/openbao/setup:ro
      - openbao_data:/openbao/file
    cap_add:
      - IPC_LOCK
    networks: [ihnet]
    healthcheck:
      # 501 = inicializado pero sellado; 503 = sin inicializar. Los dos son "el proceso vive":
      # un contenedor sellado esta sano, solo esperando su llave.
      test: ["CMD", "sh", "-c", "bao status -address=http://127.0.0.1:8200 2>&1 | grep -q Sealed"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------------
  # Consumidor de auditoria (NATIVO aarch64). Kafka -> cold-store en Postgres.
  # ---------------------------------------------------------------------------------
  audit-consumer:
    image: ${CONSUMER_IMAGE:-integration-hub-audit-consumer:native-arm64}
    container_name: ih-audit-consumer
    restart: always
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/integration_hub
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    networks: [ihnet]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # ---------------------------------------------------------------------------------
  # Plataforma (imagen NATIVA aarch64 con /appih horneado).
  # ---------------------------------------------------------------------------------
  platform-app:
    image: ${APP_IMAGE:-integration-hub:native-appih-arm64}
    container_name: ih-app
    restart: always
    volumes:
      - ./config/application.properties:/work/config/application.properties:ro
      - ./data-filesystem:/work/data/filesystem
    environment:
      QUARKUS_PROFILE: "prod,onprem"
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8080"
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ENABLE_FORWARDED_HOST: "true"
      QUARKUS_HTTP_PROXY_ENABLE_FORWARDED_PREFIX: "true"
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/integration_hub"
      QUARKUS_DATASOURCE_USERNAME: "postgres"
      QUARKUS_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9094"
      TASKS_ASYNC_EXECUTION_ENABLED: "true"
      TASKS_DISPATCH_ENABLED: "true"
      MP_MESSAGING_INCOMING_TASKS_IN_ENABLED: "true"
      # La app llega a Keycloak por la red INTERNA (no necesita el proxy ni el certificado) pero
      # VALIDA el issuer PUBLICO, que es el que viaja en los tokens del navegador. Los dos
      # valores tienen que existir por separado: con uno solo, o no conecta o rechaza tokens.
      QUARKUS_OIDC_AUTH_SERVER_URL: "http://keycloak:8180/iam/realms/integration-hub"
      QUARKUS_OIDC_DISCOVERY_ENABLED: "false"
      QUARKUS_OIDC_JWKS_PATH: "protocol/openid-connect/certs"
      QUARKUS_OIDC_TOKEN_ISSUER: "https://${PUBLIC_HOST:?falta PUBLIC_HOST}/iam/realms/integration-hub"
      INTEGRATIONHUB_SECRETS_VAULT_ENABLED: "true"
      INTEGRATIONHUB_SECRETS_VAULT_ADDRESS: "http://openbao:8200"
      INTEGRATIONHUB_SECRETS_VAULT_KV_MOUNT: "secret"
      # Token ACOTADO por politica, nunca el raiz. Si falta, toda resolucion falla con
      # "Missing vaultkv value: <ruta>" — el MISMO mensaje que si el secreto no existe o si
      # OpenBao esta sellado. Ante ese error, mirar token y sello antes que la ruta.
      INTEGRATIONHUB_SECRETS_VAULT_TOKEN: "${OPENBAO_TOKEN:-}"
    networks: [ihnet]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_started
