# Configuracion de la plataforma en la VM de nube. Se monta en /work/config/.
#
# DOS COSAS QUE ESTABAN EN INTEGRACION Y AQUI NO ESTAN, A PROPOSITO:
#
# 1. El file-vault (quarkus.file.vault.provider.dev.*), que alli abre un .p12 con la contrasena
#    "change-me" escrita en claro. Es el respaldo de las referencias `${secret:...}`.
#
#    Aqui la fuente de secretos es OpenBao, y las referencias se escriben `${vaultkv:...}`. Un
#    `${secret:...}` en esta maquina fallara con "Missing secret value" — y eso es lo correcto:
#    fallar fuerte al leer una credencial es mejor que resolverla desde un almacen cuya clave
#    esta publicada en un fichero de configuracion.
#
#    Si hace falta migrar procesos que ya usan `${secret:...}`, se reescriben a `${vaultkv:...}`
#    y su valor se da de alta en OpenBao. No se reactiva el file-vault.
#
# 2. tasks.sftp.bank.known-hosts, que apuntaba a un fichero montado desde el paquete de
#    integracion. Aqui no se monta: el destino del money-path es una cuenta SFTP gestionada cuya
#    huella cambia al recrear la cuenta, y la entrega va con strictHostKeyChecking en false, que
#    es una concesion acotada a un entorno de PRUEBAS.
#
#    ANTES DE ENVIAR A UN BANCO DE VERDAD hay que volver a poner la huella y activar la
#    comprobacion: sin ella, un intermediario puede hacerse pasar por el destino, y lo que viaja
#    son ordenes de pago.

# El consumidor de tareas arranca leyendo desde el principio del topic, no desde el final: si la
# app estuvo caida, las tareas encoladas se procesan igualmente en vez de perderse.
mp.messaging.incoming.tasks-in.auto.offset.reset=earliest

# Maker-checker del reconocimiento de conflictos de pago: dos personas distintas, una solicita y
# otra aprueba. En una maquina que despacha dinero esto va activado.
mt101.pay.conflict.acknowledge.maker-checker.enabled=true
