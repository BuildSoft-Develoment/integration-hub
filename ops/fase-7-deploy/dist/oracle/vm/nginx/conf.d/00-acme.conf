# Puerto 80: validacion ACME y redireccion. Nada mas.
#
# Este fichero es el que rompe el huevo-y-gallina del certificado: la CA valida haciendo una
# peticion HTTP REAL a /.well-known/acme-challenge/, asi que nginx tiene que estar sirviendo
# ANTES de que exista ningun certificado. Por eso la validacion vive en el 80 y no en el 443.
#
# Y por eso el 80 se queda abierto para siempre: la renovacion, cada 60 dias, repite la misma
# validacion. Cerrarlo "porque todo va por HTTPS" hace caducar el certificado tres meses
# despues, cuando ya nadie relaciona una cosa con la otra.
server {
    listen 80;
    server_name _;

    # El reto ACME NO se redirige a HTTPS: la CA lo pide por HTTP y un 301 rompe la validacion.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demas sube a HTTPS. Redireccion RELATIVA (absolute_redirect off): nginx pega el
    # puerto en el que ESCUCHA a las URLs absolutas que construye, y no tiene por que ser el
    # que uso el cliente. Ese fallo ya se pago una vez.
    absolute_redirect off;
    location / {
        return 301 https://$host$request_uri;
    }
}
