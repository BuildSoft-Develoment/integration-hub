server {
    listen 80;

    # Mock del gateway de STATUS del banco para la casuistica de pay-conflicts.
    # El task MT101_STATUS hace GET /status/<sendersReference> y lee $.status + $.gatewayReference.
    # Rechazamos las referencias cuyo ultimo caracter es 2 o 3 -> el worker las mando SENT pero el
    # banco dice REJECTED = conflicto (SENT->REJECTED) con su confirmacion. El resto: ACCEPTED.
    location ~ ^/status/(?<ref>.+)$ {
        default_type application/json;
        set $st "ACCEPTED";
        if ($ref ~ "[23]$") { set $st "REJECTED"; }
        return 200 '{"status":"$st","gatewayReference":"GW-$ref"}';
    }

    # Mock del gateway de PAGO (MT101_PAY transport=REST). RestPaymentTransport lee del cuerpo
    # $.accepted (successField) y $.gatewayReference (referenceField) cuando la respuesta es 2xx.
    #
    # Ojo: el transporte trata la AUSENCIA de $.accepted como aceptado
    # (`declaredOk = successFlag == null || parseBoolean(successFlag)`), asi que un 200 generico
    # tambien produce sent. Por eso el CP PAY-21 no se puede evidenciar contra la respuesta
    # generica de abajo: hay que DECLARAR el campo para que el mapeo se ejerza de verdad.
    location /v1/swift/mt101 {
        default_type application/json;
        return 200 '{"accepted":true,"gatewayReference":"GW-PAY-OK"}';
    }

    # Contraparte negativa: 200 con accepted=false debe mapear a rejected, no a sent. Sin esta ruta
    # no se puede distinguir "el mapeo funciona" de "todo 2xx se acepta".
    location /v1/swift/mt101-reject {
        default_type application/json;
        return 200 '{"accepted":false,"error":{"message":"cuenta de beneficiario cerrada"}}';
    }

    location / {
        default_type application/json;
        return 200 '{"ok":true,"service":"mock-gateway"}';
    }
}
