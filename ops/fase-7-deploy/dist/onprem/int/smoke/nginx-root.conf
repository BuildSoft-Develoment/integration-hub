# Variante de SMOKE: la app corre en RAIZ (/) con la imagen por defecto integration-hub:native
# (sin /appih horneado). Keycloak sigue en /iam. Sirve para validar el wiring de los
# contenedores antes de invertir en la imagen /appih.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Smoke local: 8080 (el 80 lo tiene http.sys/System en Windows). En el server real -> 80.
    listen 8080;
    server_name app.buildsoft.com.pe localhost;

    # ---- Keycloak (/iam) — antes que / (prefijo mas largo, pero explicito) ----
    location /iam/ {
        proxy_pass http://keycloak:8180;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout 300s;
    }

    # ---- Widget del plugin ----
    location /pluginwidget/ {
        proxy_pass http://frontend-widget:80/;
        proxy_set_header Host $host;
    }

    # ---- App en raiz ----
    location / {
        proxy_pass http://platform-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
