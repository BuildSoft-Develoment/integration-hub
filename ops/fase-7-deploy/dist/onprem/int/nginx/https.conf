# =====================================================================================
# Variante HTTPS (self-signed) para el e2e LOCAL por IP. HTTPS da contexto seguro ->
# keycloak-js puede usar crypto.subtle (PKCE S256). Ademas inyecta window.__ihConfig via
# sub_filter para que el frontend apunte a Keycloak en /iam (no al default dev localhost:8180).
#
# Para el server REAL: usar cert valido del dominio + ajustar la URL del sub_filter y de KC.
# =====================================================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    # Unico server block del archivo, asi que atiende cualquier Host igual; se listan los usados
    # para que quede escrito por donde se entra. La IP de LAN cambia con la red.
    server_name app.buildsoft.com.pe 192.168.100.25 localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location = / {
        return 302 /appih/;
    }

    # ---- App Integration Hub (root-path /appih). Inyecta __ihConfig en el index. ----
    location /appih/ {
        proxy_pass http://platform-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        # sub_filter necesita el body sin comprimir.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter_types text/html;
        # La URL de Keycloak se deriva del origen que uso el navegador ($host ya viene sin puerto),
        # no se escribe a mano: antes era una IP fija y al cambiar de red el frontend quedaba
        # pidiendo tokens a una IP muerta. Ojo: esto arregla el lado del navegador, pero el ISSUER
        # que emite Keycloak y que valida el app sale de PUBLIC_BASE_URL en int/.env, y tiene que
        # coincidir con este origen. Si entras por IP, PUBLIC_BASE_URL va con esa IP.
        sub_filter '</head>' '<script>window.__ihConfig={keycloak:{url:"https://$host:$server_port/iam",realm:"integration-hub",clientId:"integration-hub-ui"}};</script></head>';
    }

    # ---- API + health con path absoluto -> app bajo /appih ----
    location /api/ {
        proxy_pass http://platform-app:8080/appih/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout 300s;
    }
    location /q/ {
        proxy_pass http://platform-app:8080/appih/q/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ---- Keycloak en /iam ----
    location /iam/ {
        proxy_pass http://keycloak:8180;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout 300s;
    }

    location /pluginwidget/ {
        proxy_pass http://frontend-widget:80/;
        proxy_set_header Host $host;
    }

    # Catch-all: el SPA/importmap piden algunos paths con raiz ABSOLUTA (no relativos al
    # base-href /appih/): p.ej. "/stubs/angular-core-testing.js" del importmap, o
    # "/plugins/catalog.json". El app los sirve bajo /appih -> los puenteamos aca. Cae despues
    # de los location mas especificos (/appih/, /iam/, /api/, /q/, /pluginwidget/).
    location / {
        proxy_pass http://platform-app:8080/appih/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
