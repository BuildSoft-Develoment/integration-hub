# =====================================================================================
# Reverse proxy del ambiente de integracion. Replica lo que hara el nginx del server
# real (app.buildsoft.com.pe): app en /appih, Keycloak en /iam, widget en /pluginwidget.
#
# Para plegar en el nginx REAL del servidor: copiar los tres `location` dentro del
# server block existente (:80) y apuntar los `proxy_pass` a los upstreams reales
# (host:puerto de la app y de Keycloak). El resto de headers X-Forwarded es lo mismo.
# =====================================================================================

# Bloque de headers reutilizado (Keycloak y la app confian en X-Forwarded-*).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name app.buildsoft.com.pe localhost;

    # Cortesia: raiz -> app.
    location = / {
        return 302 /appih/;
    }

    # ---- App Integration Hub (root-path /appih horneado en la imagen nativa) ----
    location /appih/ {
        proxy_pass http://platform-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # ---- API + health con path ABSOLUTO ----
    # El SPA llama al backend con paths absolutos (`/api/...`, no relativos al base-href),
    # p.ej. system-theme-config.service.ts: baseUrl = '/api/system/theme'. Bajo /appih la
    # app los sirve en /appih/api y /appih/q, asi que aca puenteamos /api -> /appih/api.
    # (Fix limpio a futuro: que el frontend use paths relativos al base-href.)
    location /api/ {
        proxy_pass http://platform-app:8080/appih/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout 300s;
    }
    location /q/ {
        proxy_pass http://platform-app:8080/appih/q/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ---- Keycloak (relative-path /iam). Login + issuer + assets bajo /iam ----
    location /iam/ {
        proxy_pass http://keycloak:8180;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout 300s;
    }

    # ---- Frontend widget del plugin (lo carga el browser cross-origin) ----
    # El nginx del propio widget ya emite CORS; aca solo enrutamos.
    location /pluginwidget/ {
        proxy_pass http://frontend-widget:80/;
        proxy_set_header Host $host;
    }

    # Catch-all: paths con raiz ABSOLUTA que el SPA/importmap piden sin /appih (p.ej.
    # /stubs/angular-core-testing.js del importmap, /plugins/catalog.json). El app los sirve
    # bajo /appih -> los puenteamos. Cae despues de los location mas especificos.
    location / {
        proxy_pass http://platform-app:8080/appih/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
