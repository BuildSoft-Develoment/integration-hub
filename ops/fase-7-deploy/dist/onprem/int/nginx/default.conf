# =====================================================================================
# Reverse proxy del ambiente de integracion. Replica lo que hara el nginx del server
# real (app.buildsoft.com.pe): app en /appih, Keycloak en /iam, widget en /pluginwidget.
#
# Para plegar en el nginx REAL del servidor: copiar los tres `location` dentro del
# server block existente (:80) y apuntar los `proxy_pass` a los upstreams reales
# (host:puerto de la app y de Keycloak). El resto de headers X-Forwarded es lo mismo.
# =====================================================================================

# Bloque de headers reutilizado (Keycloak y la app confian en X-Forwarded-*).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name app.buildsoft.com.pe localhost;

    # Cortesia: raiz -> app.
    location = / {
        return 302 /appih/;
    }

    # ---- App Integration Hub (root-path /appih horneado en la imagen nativa) ----
    location /appih/ {
        proxy_pass http://platform-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # ---- API + health con path ABSOLUTO ----
    # El SPA llama al backend con paths absolutos (`/api/...`, no relativos al base-href),
    # p.ej. system-theme-config.service.ts: baseUrl = '/api/system/theme'. Bajo /appih la
    # app los sirve en /appih/api y /appih/q, asi que aca puenteamos /api -> /appih/api.
    # (Fix limpio a futuro: que el frontend use paths relativos al base-href.)
    location /api/ {
        proxy_pass http://platform-app:8080/appih/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout 300s;
    }
    location /q/ {
        proxy_pass http://platform-app:8080/appih/q/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ---- Keycloak (relative-path /iam). Login + issuer + assets bajo /iam ----
    location /iam/ {
        proxy_pass http://keycloak:8180;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout 300s;
    }

    # ---- Frontend widget del plugin (lo carga el browser cross-origin) ----
    # El nginx del propio widget ya emite CORS; aca solo enrutamos.
    # ---- OpenBao en /ui/ y /v1/ ----
    #
    # POR QUE SE LLEVA DOS PREFIJOS DE LA RAIZ, Y NO VA BAJO /openbao/ COMO KEYCLOAK BAJO /iam/
    #
    # Keycloak sabe servirse bajo un prefijo (KC_HTTP_RELATIVE_PATH) y regenera sus URLs. OpenBao
    # no tiene equivalente: su UI es una SPA compilada que pide sus activos con ruta ABSOLUTA
    # (href="/ui/assets/...", src="/ui/assets/...") y llama a su API en /v1/. Eso va dentro del
    # HTML que sirve el binario, asi que ninguna opcion de config.hcl lo reescribe —comprobado en
    # la documentacion: `api_addr` solo ANUNCIA una direccion para redirecciones, no cambia rutas—.
    #
    # Montarlo en /openbao/ dejaria la interfaz cargando y sin poder hablar con su API: las
    # llamadas a /v1/ caerian en el catch-all y acabarian en platform-app.
    #
    # ⚠️ ESTOS DOS PREFIJOS QUEDAN RESERVADOS. Hoy la app no los usa —sus rutas absolutas son
    # /stubs/, /plugins/, /api/ y /q/, verificado—. Si algun dia necesita /ui/ o /v1/, chocara con
    # OpenBao y el sintoma sera dificil de leer: peticiones que se van al inquilino equivocado.
    location /ui/ {
        proxy_pass http://openbao:8200/ui/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
    location /v1/ {
        proxy_pass http://openbao:8200/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
    # Atajo memorizable: /openbao lleva a la interfaz real.
    location = /openbao { return 302 /ui/; }

    location /pluginwidget/ {
        proxy_pass http://frontend-widget:80/;
        proxy_set_header Host $host;
    }

    # Catch-all: paths con raiz ABSOLUTA que el SPA/importmap piden sin /appih (p.ej.
    # /stubs/angular-core-testing.js del importmap, /plugins/catalog.json). El app los sirve
    # bajo /appih -> los puenteamos. Cae despues de los location mas especificos.
    location / {
        proxy_pass http://platform-app:8080/appih/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
