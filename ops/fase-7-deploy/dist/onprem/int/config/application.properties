# Override externo de config para la imagen nativa (la imagen trae
# QUARKUS_CONFIG_LOCATIONS=/work/config/, ver common/Dockerfile.native).
#
# Se usa un FILE y no env vars porque el nombre del canal `tasks-in` tiene guion: un env var
# como MP_MESSAGING_INCOMING_TASKS_IN_AUTO_OFFSET_RESET solo mapea bien si la property YA existe
# en el application.properties horneado en la imagen. Si no, SmallRye lo interpreta literal
# (`...tasks.in.auto...`) e inventa un canal `tasks` -> el app no arranca
# (SRMSG00071: the `connector` attribute must be set for channel `tasks`).

# earliest es OBLIGATORIO con la suscripcion por patron `tasks\..*`: el topic tasks.<tipo> se
# crea al PRODUCIR el primer slice; el consumer lo descubre despues y con el default `latest`
# se saltea ese primer mensaje -> la ejecucion async queda SUSPENDED para siempre.
mp.messaging.incoming.tasks-in.auto.offset.reset=earliest

# File Vault (PKCS12) para resolver ${secret:...}. El money-path CORRECTIVO exige que la
# password del SFTP sea una referencia COMPLETA al vault, no texto plano:
#   "MT101_PAY dispatch spec secret 'sftp.password' must be a COMPLETE ${secret:...} reference"
# Secreto creado con: set-task-secret.cmd secrets\dev-secrets.p12 change-me sftp bank <pass>
#   -> alias tasks/sftp/bank  -> referencia ${secret:tasks/sftp/bank/password}
quarkus.file.vault.provider.dev.path=/work/secrets/dev-secrets.p12
quarkus.file.vault.provider.dev.secret=change-me

# Mt101DispatchPlanCompiler trata como CREDENCIAL todo campo cuyo nombre contenga "knownhosts" y exige
# una referencia COMPLETA a una fuente (secret|vault|env|config). La ruta del known_hosts no es secreta,
# asi que se publica por config y la tarea la referencia como ${config:tasks.sftp.bank.known-hosts}.
tasks.sftp.bank.known-hosts=/work/sftp/known_hosts
