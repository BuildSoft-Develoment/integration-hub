# =====================================================================================
# Ambiente de INTEGRACION (int) â€” todo dockerizado detras de nginx, replicando el server
# real: app en /appih, Keycloak en /iam, host app.buildsoft.com.pe. No es PROD, pero es
# la forma mas cercana (mismo shape). Soporte en ./int/ (nginx, keycloak, smoke).
#
# Arranque:
#   1) Build de las imagenes NATIVAS (ver int/README.md > Build):
#        - integration-hub:native-appih  (platform-app con /appih horneado)
#        - integration-hub-audit-consumer:native
#   2) docker compose -f docker-compose.int.yml --env-file int/.env up -d
#   3) hosts file del host:  127.0.0.1  app.buildsoft.com.pe
#   4) Navegar https://app.buildsoft.com.pe/appih  -> login por /iam -> app.
#
# Notas de diseÃ±o:
#  - nginx es la unica puerta. Alias de red `app.buildsoft.com.pe`, asi la app resuelve el
#    issuer PUBLICO internamente (issuer consistente browser <-> app).
#  - Los 3 backends gRPC comparten el netns de la app (network_mode: service:platform-app)
#    -> la app los ve en 127.0.0.1:5006x = localhost => trusted por la plugin trust-policy.
#  - Broker: SOLO Kafka (async dispatch + backbone de auditoria).
#  - Auditoria: audit-consumer (NATIVO) consume de Kafka y persiste el store frio en
#    ClickHouse (audit.cold-store.type=CLICKHOUSE); postgres es la BD operacional.
# =====================================================================================
name: integration-hub-int

networks:
  ihnet:
    driver: bridge

volumes:
  pg_data:
  minio_data:
  sftp_source_data:
  ftp_source_data:
  openbao_data:

services:
  # ---------------------------------------------------------------------------------
  # nginx: reverse proxy publico. App en /appih, Keycloak en /iam.
  # ---------------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: ih-int-nginx
    ports:
      - "${NGINX_PORTS:-80:80}"
    volumes:
      - ${NGINX_CONF:-./int/nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./int/nginx/certs:/etc/nginx/certs:ro
    networks:
      ihnet:
        aliases:
          - app.buildsoft.com.pe
    depends_on:
      - platform-app
      - keycloak
    restart: always

  # ---------------------------------------------------------------------------------
  # Postgres â€” base de datos OPERACIONAL de la plataforma (y del audit-consumer).
  # ---------------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ih-int-postgres
    restart: always
    environment:
      POSTGRES_DB: integration_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [ihnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d integration_hub"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------------
  # Keycloak â€” detras de nginx en /iam. Issuer = <PUBLIC_BASE_URL>/iam/realms/â€¦
  # ---------------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: ih-int-keycloak
    restart: always
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8180"
      KC_HTTP_RELATIVE_PATH: "/iam"
      KC_PROXY_HEADERS: "xforwarded"
      # Hostname publico INCLUYENDO el subpath /iam: el issuer queda â€¦/iam/realms/â€¦ y
      # matchea el auth-server-url del app (con KC_HOSTNAME puro origin, KC no lo agrega).
      KC_HOSTNAME: "${PUBLIC_BASE_URL:-https://app.buildsoft.com.pe}/iam"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      # Secreto del cliente `openbao` del realm. Keycloak sustituye los ${...} del JSON de import
      # desde SU entorno, asi que el valor no vive en el repo: sale de int/.env (ignorado por git).
      # El MISMO valor lo necesita OpenBao al configurar el metodo oidc; por eso hay un unico knob.
      #
      # Si falta, Keycloak importa el literal "${OPENBAO_OIDC_CLIENT_SECRET}" como secreto y el
      # login falla en el canje del codigo con "invalid_client" — un error que apunta al cliente,
      # no a la variable que falta.
      #
      # El `:?` la hace OBLIGATORIA para TODO el compose, no solo para keycloak: sin ella fallan
      # incluso `config` y `docker compose ps`. Es deliberado —un secreto vacio se importaria en
      # silencio y el sintoma llegaria mucho despues, disfrazado de cliente mal creado— pero conviene
      # saberlo antes de tropezar en medio de una incidencia. Para diagnosticar sin la variable,
      # `docker ps --filter name=ih-int` no pasa por el compose y sigue funcionando.
      #
      # ⚠️ AL EDITAR EL REALM JSON: Keycloak sustituye los marcadores de llaves en CUALQUIER campo,
      # no solo en `secret`. Un marcador escrito en `description` —aunque sea para explicar de donde
      # sale el valor— PUBLICA el secreto en esa descripcion, visible en la consola de administracion
      # y en cualquier export del realm. Ya paso una vez. Nombrar la variable SIN llaves.
      #
      # Y ese campo es VARCHAR(255): una descripcion mas larga no se trunca, hace fallar el import
      # entero y Keycloak arranca en bucle. Tambien paso.
      OPENBAO_OIDC_CLIENT_SECRET: "${OPENBAO_OIDC_CLIENT_SECRET:?falta OPENBAO_OIDC_CLIENT_SECRET en int/.env}"
    volumes:
      - ${KC_REALM:-./int/keycloak/integration-hub-realm.json}:/opt/keycloak/data/import/integration-hub-realm.json:ro
      # Override-able como KC_REALM: el default apunta a la raiz del REPO (4 niveles arriba desde
      # ops/fase-7-deploy/dist/onprem), pero en el paquete autocontenido de deploy los temas viajan
      # dentro de dist/onprem/, donde esa ruta relativa se sale del paquete y falla con "Mounts denied".
      # El paquete lo sobreescribe en int/.env con ./keycloak/themes.
      - ${KC_THEMES:-../../../../keycloak/themes}:/opt/keycloak/themes:ro
    networks: [ihnet]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8180'"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------------
  # Kafka (KRaft) â€” UNICO broker: async dispatch + backbone de auditoria.
  # ---------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: ih-int-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [ihnet]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------------
  # MinIO (S3-compatible) â€” staging de artefactos de plugins + fuentes S3.
  # ---------------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: ih-int-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks: [ihnet]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: ih-int-minio-init
    depends_on:
      - minio
    networks: [ihnet]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/remote-plugin-staging;
      mc mb --ignore-existing local/ih-source-inbox;
      exit 0;
      "

  # ---------------------------------------------------------------------------------
  # SFTP fuente â€” SftpSourceProvider.
  # ---------------------------------------------------------------------------------
  sftp-source:
    image: atmoz/sftp:alpine
    container_name: ih-int-sftp-source
    restart: always
    command: ${SFTP_SOURCE_USER:-ihsource}:${SFTP_SOURCE_PASS:-ihsource}:1001:1001:upload
    volumes:
      - sftp_source_data:/home/${SFTP_SOURCE_USER:-ihsource}/upload
    networks: [ihnet]

  # ---------------------------------------------------------------------------------
  # FTP fuente â€” FtpSourceProvider (PASV).
  # ---------------------------------------------------------------------------------
  ftp-source:
    image: delfer/alpine-ftp-server:latest
    container_name: ih-int-ftp-source
    restart: always
    environment:
      USERS: "${FTP_SOURCE_USER:-ihftp}|${FTP_SOURCE_PASS:-ihftp}|/ftp/ihftp"
      ADDRESS: ftp-source
      MIN_PORT: "21000"
      MAX_PORT: "21010"
    volumes:
      - ftp_source_data:/ftp/${FTP_SOURCE_USER:-ihftp}
    networks: [ihnet]

  # ---------------------------------------------------------------------------------
  # SFTP BANCO (PAY/STATUS) — YA NO ES UN CONTENEDOR.
  #
  # El destino del money-path es ahora una cuenta SFTP en la nube (sftpcloud), configurada en la
  # definicion de conexion de la app: host/usuario en int/.env y la clave SOLO como referencia
  # ${secret:tasks/sftp/bank/password} (QA-006: nunca en claro, ni aqui ni en .env.example).
  #
  # Un servidor SFTP es justo lo que si tiene equivalente gratuito gestionado, asi que mantenerlo
  # como contenedor solo anadia una pieza que operar. Lo que NO se puede contratar es el cerebro del
  # banco: bank-sim sigue existiendo, pero ya no comparte volumen — habla SFTP contra esa cuenta.
  # Ver int/bank-sim/README.md.
  # ---------------------------------------------------------------------------------
  # ---------------------------------------------------------------------------------
  # OpenBao — gestor de secretos (infra, fuentes externas, conexiones a BD).
  #
  # NO es el contenedor de desarrollo. Aquel arranca en modo dev: desellado, en MEMORIA y con
  # token raiz fijo, y pierde todo al reiniciar. Este usa almacenamiento persistente y arranca
  # SELLADO. Tras cada reinicio hay que desellarlo a mano; esa friccion es la propiedad, no un
  # defecto de configuracion.
  #
  # No publica puerto al host: solo se llega por nginx (/ui/ y /v1/). Ver int/nginx/https.conf.
  openbao:
    image: openbao/openbao:2.6.1
    container_name: ih-int-openbao
    restart: always
    command: ["server", "-config=/openbao/config/config.hcl"]
    environment:
      # Direccion PUBLICA que OpenBao anuncia en sus redirecciones. Sale del MISMO knob que usan
      # Keycloak y la app, para que entrar por IP local no mande al usuario al dominio.
      BAO_API_ADDR: "${PUBLIC_BASE_URL:-https://app.buildsoft.com.pe}"
    volumes:
      - ./int/openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao_data:/openbao/file
      # El script de SSO y la politica, para poder ejecutarlos con `docker exec` sin copiar nada.
      - ./int/openbao:/openbao/setup:ro
      # El certificado de nginx. Para el SSO, OpenBao llama a Keycloak POR LA URL PUBLICA (ver
      # config.hcl), que va por HTTPS con un certificado AUTOFIRMADO —lo es: emisor y sujeto
      # coinciden—. Sin este fichero, el descubrimiento muere con un error de verificacion TLS.
      # Al ser autofirmado, el propio certificado hace de CA.
      - ./int/nginx/certs/server.crt:/openbao/tls/nginx-ca.crt:ro
    # Deja al proceso bloquear memoria para que los secretos no acaben en swap.
    cap_add:
      - IPC_LOCK
    networks: [ihnet]
    healthcheck:
      # 501 = inicializado pero SELLADO; 503 = sin inicializar. Los dos son "el proceso vive",
      # asi que se aceptan: un contenedor sellado esta sano, solo esperando su llave.
      test: ["CMD", "sh", "-c", "bao status -address=http://127.0.0.1:8200 2>&1 | grep -q Sealed"]
      interval: 15s
      timeout: 5s
      retries: 5
  # ---------------------------------------------------------------------------------
  # Consumidor de auditoria â€” NATIVO. Kafka -> cold-store POSTGRES (default; ClickHouse
  # deferido). Requiere el runner nativo (mvn -pl audit-consumer -am package -Pnative ...)
  # antes del docker build. Ver int/README.md.
  # ---------------------------------------------------------------------------------
  audit-consumer:
    build:
      context: ../../../../audit-consumer
      dockerfile: src/main/docker/Dockerfile.native
    image: integration-hub-audit-consumer:native
    container_name: ih-int-audit-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/integration_hub
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      # cold-store: POSTGRES por default (audit.cold-store.type). ClickHouse deferido.
    networks: [ihnet]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: always

  # ---------------------------------------------------------------------------------
  # Plataforma (imagen NATIVA con /appih horneado). Ancla el netns de plugins.
  # ---------------------------------------------------------------------------------
  platform-app:
    image: ${APP_IMAGE:-integration-hub:native-appih}
    container_name: ih-int-app
    volumes:
      # known_hosts del SFTP source (strictHostKeyChecking=true por default). El form de la
      # fuente SFTP apunta knownHostsPath aca.
      - ./int/sftp/known_hosts:/work/sftp/known_hosts:ro
      # Config externa (la imagen trae QUARKUS_CONFIG_LOCATIONS=/work/config/): properties que
      # no se pueden pasar por env var (p.ej. canales con guion como tasks-in).
      - ./int/config/application.properties:/work/config/application.properties:ro
      # File Vault (PKCS12) para ${secret:...}: el pago correctivo MT101 exige que la password
      # del SFTP sea una referencia al vault, no texto plano.
      # Mismo motivo que KC_THEMES: el default vale para el repo, el paquete lo sobreescribe en int/.env.
      - ${SECRETS_P12:-../../../../secrets/dev-secrets.p12}:/work/secrets/dev-secrets.p12:ro
      # Fuente FILESYSTEM (cuarta fuente de las pruebas manuales, junto a SFTP/FTP/S3). Es un bind
      # mount para que el operador pueda dejar y retirar ficheros desde el host -en el Ubuntu, un
      # simple cp al directorio- sin entrar al contenedor. En la definicion de la fuente, `path`
      # apunta a /work/data/filesystem. NO va :ro: el motor puede mover o borrar el fichero
      # procesado segun la politica de la fuente.
      - ./int/data-filesystem:/work/data/filesystem
    environment:
      QUARKUS_PROFILE: "prod,onprem"
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8080"
      # Detras de nginx: confiar en X-Forwarded-* para redirects OIDC correctos.
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ENABLE_FORWARDED_HOST: "true"
      QUARKUS_HTTP_PROXY_ENABLE_FORWARDED_PREFIX: "true"
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/integration_hub"
      QUARKUS_DATASOURCE_USERNAME: "postgres"
      QUARKUS_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-admin}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9094"
      # Despacho async (ADR-015): gate OFF por default. Aca ON para probar tareas async ->
      # dispatch a Kafka (tasks-out) + consumer in-process (tasks-in, topic pattern tasks..*).
      TASKS_ASYNC_EXECUTION_ENABLED: "true"
      TASKS_DISPATCH_ENABLED: "true"
      MP_MESSAGING_INCOMING_TASKS_IN_ENABLED: "true"
      # OJO: `auto.offset.reset` del canal tasks-in NO va por env var (el guion de `tasks-in`
      # mapea mal si la property no esta horneada en la imagen -> inventa un canal `tasks` y el
      # app no arranca). Va en el properties externo montado en /work/config/ (ver int/config/).
      # OIDC behind-proxy: el app (resource server, valida bearer tokens) apunta al KC INTERNO
      # (keycloak:8180, HTTP, sin depender del cert publico) para traer el JWKS, y acepta el
      # issuer PUBLICO que emiten los tokens (token.issuer). discovery=false + jwks-path interno
      # evita que el app toque la URL publica HTTPS (self-signed). Sirve igual en prod.
      QUARKUS_OIDC_AUTH_SERVER_URL: "http://keycloak:8180/iam/realms/integration-hub"
      QUARKUS_OIDC_DISCOVERY_ENABLED: "false"
      QUARKUS_OIDC_JWKS_PATH: "protocol/openid-connect/certs"
      QUARKUS_OIDC_TOKEN_ISSUER: "${PUBLIC_BASE_URL:-https://app.buildsoft.com.pe}/iam/realms/integration-hub"
      # --- Secretos en OpenBao (fuente `vaultkv`) ---
      #
      # La app llega por la red INTERNA del compose, no por nginx: no necesita el certificado
      # publico ni depende de que el proxy este arriba. Es el mismo criterio que arriba con
      # QUARKUS_OIDC_AUTH_SERVER_URL apuntando a keycloak:8180.
      #
      # El TOKEN no se escribe aqui NI en .env.example: sale de OPENBAO_TOKEN, que cada entorno
      # pone en su propio int/.env (ignorado por git). Y no deberia ser el token raiz: lo suyo es
      # uno acotado por politica a leer secret/connections/* y secret/tasks/*. Ver
      # int/openbao/policy-integration-hub.hcl.
      #
      # Sin OPENBAO_TOKEN la variable queda vacia y el cliente devuelve vacio en toda resolucion:
      # el error que se vera es "Missing vaultkv value: <ruta>", el MISMO que si el secreto no
      # existe o si OpenBao esta caido. Si aparece, comprobar el token antes que nada.
      INTEGRATIONHUB_SECRETS_VAULT_ENABLED: "true"
      INTEGRATIONHUB_SECRETS_VAULT_ADDRESS: "http://openbao:8200"
      INTEGRATIONHUB_SECRETS_VAULT_KV_MOUNT: "secret"
      INTEGRATIONHUB_SECRETS_VAULT_TOKEN: "${OPENBAO_TOKEN:-}"
      INTEGRATIONHUB_PLUGIN_REMOTE_STAGING_ENDPOINT: "http://minio:9000"
    networks: [ihnet]
    # NO publicamos los puertos gRPC de los plugins (50061-63) al host: la app los alcanza en
    # 127.0.0.1:5006x DENTRO del netns compartido, no hace falta exponerlos. Ademas Windows
    # reserva rangos de puertos altos (Hyper-V/WSL) que cambian tras cada reinicio y rompian
    # el bind (ports are not available). Para inspeccionarlos: docker exec en un plugin.
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_started
    restart: always

  # ---------------------------------------------------------------------------------
  # 3 backends gRPC â€” comparten el netns de la app => la ve en 127.0.0.1:5006x (localhost).
  # ---------------------------------------------------------------------------------
  plugin-java:
    image: demo-transform-java:1.0.0
    build: ../../../../ejemplos/plugin-demo/backend-grpc-java
    container_name: ih-int-plugin-java
    restart: always
    environment:
      PLUGIN_GRPC_PORT: "50061"
      # Comparte el netns del app (que ya usa 8080) -> el HTTP server del plugin Quarkus a
      # puerto 0 (random) para no chocar; solo importa el gRPC en 50061.
      QUARKUS_HTTP_PORT: "0"
    network_mode: "service:platform-app"
    depends_on:
      platform-app:
        condition: service_started

  plugin-node:
    image: demo-transform-node:1.0.0
    build: ../../../../ejemplos/plugin-demo/backend-grpc-node
    container_name: ih-int-plugin-node
    restart: always
    environment:
      PLUGIN_GRPC_PORT: "50062"
    network_mode: "service:platform-app"
    depends_on:
      platform-app:
        condition: service_started

  plugin-python:
    image: demo-transform-py:1.0.0
    build: ../../../../ejemplos/plugin-demo/backend-grpc-python
    container_name: ih-int-plugin-python
    restart: always
    environment:
      PLUGIN_GRPC_PORT: "50063"
    network_mode: "service:platform-app"
    depends_on:
      platform-app:
        condition: service_started

  # ---------------------------------------------------------------------------------
  # Frontend widget del plugin â€” lo carga el BROWSER via nginx (/pluginwidget).
  # ---------------------------------------------------------------------------------
  frontend-widget:
    image: demo-transform-widget:1.0.0
    build: ../../../../ejemplos/plugin-demo/frontend-widget
    container_name: ih-int-plugin-widget
    restart: always
    networks: [ihnet]

  # Echo HTTP â€” destino de las tareas REST_CALL (para probar el offload async). Devuelve
  # el request como JSON y 200. La app lo alcanza en http://echo.
  echo:
    image: ealen/echo-server:latest
    container_name: ih-int-echo
    restart: always
    environment:
      PORT: "80"
    networks: [ihnet]

  # Mock del gateway de STATUS del banco (casuistica pay-conflicts): responde GET /status/<ref> con
  # {"status":ACCEPTED|REJECTED,...}. Rechaza refs terminadas en 2/3 -> el task MT101_STATUS de
  # proc-mt101-payconflict-qa detecta la contradiccion SENT->REJECTED y genera el conflicto + evidencia.
  # La app lo alcanza en http://ih-mock-gw (alias de red).
  mock-gateway:
    image: nginx:1.27-alpine
    container_name: ih-int-mock-gw
    restart: always
    volumes:
      - ./int/mock-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      ihnet:
        aliases:
          - ih-mock-gw
