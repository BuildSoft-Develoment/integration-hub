# =====================================================================================
# Overlay On-Premise  ->  QUARKUS_PROFILE=prod,onprem
#
# Secretos: file vault del proyecto (create-file-vault-secret.cmd) o HashiCorp Vault,
# inyectados como env por el orquestador; el perfil prod los lee por env.
# Staging de plugins remotos: MinIO (S3-compatible) -> reutiliza quarkus-amazon-s3.
# DB: PostgreSQL self-managed.  IdP: Keycloak self-hosted.  MQ: Kafka/Artemis self-hosted.
#
# Coherente con stacks/stack-operacion-onprem.md: Compose en DEV, Kubernetes en PRO.
# =====================================================================================

# MinIO via API S3-compatible (endpoint interno del cluster/host).
quarkus.amazon.s3.aws.region=${S3_REGION:us-east-1}
quarkus.amazon.s3.endpoint-override=${S3_ENDPOINT}
integrationhub.plugin.remote.staging.bucket=${PLUGIN_STAGING_BUCKET:remote-plugin-staging}
integrationhub.plugin.remote.staging.path-style-access=true

# Sin nube gestionada: OIDC/OTLP/Kafka apuntan a los servicios del propio stack
# (heredados de application-prod via OIDC_AUTH_SERVER_URL, OTEL_OTLP_ENDPOINT, KAFKA_BOOTSTRAP_SERVERS).
