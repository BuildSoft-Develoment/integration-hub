# =====================================================================================
# Perfil base de PRODUCCION (comun a todas las nubes).
#
# Se activa con QUARKUS_PROFILE=prod y se COMPONE con el perfil de nube:
#   QUARKUS_PROFILE=prod,aws   (o azure/gcp/oracle/onprem)
# El ultimo perfil gana, asi que application-<nube>.properties sobreescribe lo de aqui.
#
# REGLA: aqui NO va ningun secreto ni endpoint fijo. Todo se resuelve por variable de
# entorno (inyectada por el orquestador desde el vault de cada nube). Los .env.example
# de cada carpeta documentan que setear.
# =====================================================================================

quarkus.application.name=integration-hub
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# --- Datasource (Postgres gestionado por nube: RDS / Flexible Server / Cloud SQL / Autonomous) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:20}

# En prod el esquema lo gobierna Flyway; Hibernate no valida al arrancar para no
# fallar por drift benigno (coherente con application.properties de dev).
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START:true}

# --- Identidad (OIDC) ---
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc.application-type=service

# --- Observabilidad (OTLP hacia el collector gestionado o self-hosted) ---
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_OTLP_ENDPOINT}
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.resource.attributes=service.name=integration-hub,service.version=${APP_VERSION:0.0.1},deployment.environment=${DEPLOY_ENV:prod}

# --- Auditoria asincrona (backbone MQ: Kafka gestionado por nube) ---
audit.topic=${AUDIT_TOPIC:audit-events}
audit.broker.type=${AUDIT_BROKER_TYPE:KAFKA}
audit.relay.enabled=${AUDIT_RELAY_ENABLED:true}
audit.fail-business-on-error=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# --- Controles bancarios MT101 (tandas 6-8): EXPLICITOS en prod, NO heredar los defaults de dev ---
# Los defaults de codigo estan pensados para dev/UAT (maker-checker OFF, direct-list ON). En banca prod
# los invertimos aqui, override por env-var (con default seguro) para poder ajustarlos sin re-imagen.
#
# Segregacion de funciones (four-eyes) al reconocer un PAY_CONFLICT: un maker SOLICITA y un checker DISTINTO
# APRUEBA. Prod bancaria: true (una sola persona NO puede cerrar un conflicto que afecta dinero).
mt101.pay.conflict.acknowledge.maker-checker.enabled=${MT101_MAKER_CHECKER_ENABLED:true}
# PAY solo con respaldo PERSISTIDO (build_fragment): rechaza el atajo por lista en memoria. Default de codigo
# = true (dev); prod bancaria = false (todo movimiento de dinero durable, auditable y a prueba de doble pago).
mt101.pay.direct-list.enabled=${MT101_DIRECT_LIST_ENABLED:false}
# Umbral de flush por bytes del INSERT del build a escala: evita el deadlock H7 de pgJDBC (evidenciado a 1M).
mt101.build.insert-batch-max-bytes=${MT101_INSERT_BATCH_MAX_BYTES:200000}
# ADR-017 (C-2): la conexion bancaria POR RUTA se declara por sinkRef en ambos lados. Default de codigo
# = false (migracion: se acepta inline y se rechaza solo la divergencia explicita); prod bancaria = true.
# Con true, cada ruta de MT101_PAY debe nombrar su banco por sinkRef y el MT101_STATUS que la consulta debe
# nombrar el MISMO. Cierra el caso en que el pago sale a un banco y su confirmacion se busca en otro: el ACK
# nunca aparece, el fragmento queda UNCERTAIN y el operador no lo distingue de un banco caido. De paso saca
# host y credenciales del banco de dentro de la definicion del proceso.
mt101.pay.route-sink.strict=${MT101_ROUTE_SINK_STRICT:true}
# resolveNormalPay obligatorio: exige que el proceso lleve la tarea de conciliacion PAY inline. Dejar false si
# concilias por scheduler; poner true si tu diseno la resuelve inline. Condicional al diseno del proceso.
mt101.pay.require-normal-pay-resolver=${MT101_REQUIRE_NORMAL_PAY_RESOLVER:false}
# Prueba de aceptacion obligatoria en MT101_PAY REST: exige que la tarea declare COMO se prueba que el banco
# acepto (expectedGatewayResponse.successField, o acceptOn2xx=true si el gateway no prueba nada mas alla del
# status HTTP). Sin ella, un 2xx cuyo cuerpo no trae el campo se aceptaba por AUSENCIA.
# ARRANCA EN false A PROPOSITO: encenderlo hace fallar pre-despacho (INVALIDATED, re-pagable, nada sale al
# banco) toda definicion que no lo declare. Migra primero las definiciones y enciendelo despues.
mt101.pay.require-gateway-proof=${MT101_REQUIRE_GATEWAY_PROOF:false}

# --- Plugins backend out-of-process (ADR-014): allowlist/keys por env ---
integrationhub.plugins.backend.allowed-origins=${PLUGINS_ALLOWED_ORIGINS:}
integrationhub.plugins.backend.trusted-public-keys=${PLUGINS_TRUSTED_KEYS:}
integrationhub.plugins.backend.revoked-key-ids=${PLUGINS_REVOKED_KEYS:}
quarkus.grpc.server.use-separate-server=false

# Quinoa: en la imagen nativa la UI ya viene compilada y embebida; no rebuild en runtime.
quarkus.quinoa.enabled=true
quarkus.quinoa.run-tests=false
