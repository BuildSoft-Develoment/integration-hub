# =====================================================================================
# Overlay Azure  ->  QUARKUS_PROFILE=prod,azure
#
# Secretos: Azure Key Vault. Se inyectan como env/archivos via el Secrets Store CSI
# Driver (azure provider) montado en el pod; el perfil prod ya los lee por env, asi
# que Key Vault se resuelve fuera del binario (no requiere SDK Azure en el jar).
# Staging de plugins remotos: Azure Blob (AzureBlobSourceProvider, ya en el codigo).
# DB: Azure Database for PostgreSQL Flexible Server.  IdP: Keycloak en AKS o Entra ID.
# MQ: Event Hubs con endpoint Kafka-compatible.
#
# Identidad del pod: Workload Identity (AKS) -> el CSI driver toma el token; sin
# credenciales en claro.
# =====================================================================================

# Staging Blob de artefactos de plugins remotos.
integrationhub.plugin.remote.staging.container=${PLUGIN_STAGING_CONTAINER}
integrationhub.plugin.remote.staging.account=${AZURE_STORAGE_ACCOUNT}

# Event Hubs habla protocolo Kafka: KAFKA_BOOTSTRAP_SERVERS=<ns>.servicebus.windows.net:9093
# con SASL/OIDC configurado por env (ver .env.example de azure/).
