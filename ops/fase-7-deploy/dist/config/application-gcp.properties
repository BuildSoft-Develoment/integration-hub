# =====================================================================================
# Overlay GCP  ->  QUARKUS_PROFILE=prod,gcp
#
# Secretos: Google Secret Manager, inyectados como env via el Secret Manager CSI
# driver o Config Connector; el perfil prod los lee por env (sin SDK GCP en el jar).
# Staging de plugins remotos: Google Cloud Storage (GcsSourceProvider, ya en el codigo).
# DB: Cloud SQL for PostgreSQL (via Auth Proxy sidecar o IP privada).
# IdP: Keycloak en GKE o Identity Platform.  MQ: Pub/Sub (bridge Kafka) o Kafka self-managed.
#
# Identidad del pod: Workload Identity (GKE) -> la SA de K8s se mapea a una SA de GCP;
# sin key JSON en claro.
# =====================================================================================

integrationhub.plugin.remote.staging.bucket=${PLUGIN_STAGING_BUCKET}
integrationhub.plugin.remote.staging.project-id=${GCP_PROJECT_ID}

# Cloud SQL: si se usa el Auth Proxy como sidecar, DB_JDBC_URL apunta a 127.0.0.1:5432.
