# =====================================================================================
# Overlay Oracle Cloud (OCI)  ->  QUARKUS_PROFILE=prod,oracle
#
# Secretos: OCI Vault, inyectados como env via el OCI Secrets Store CSI driver;
# el perfil prod los lee por env (sin SDK OCI en el jar).
# Staging de plugins remotos: OCI Object Storage, que es S3-COMPATIBLE -> se reutiliza
# quarkus-amazon-s3 (ya en el pom) apuntando al endpoint S3 de OCI, sin dependencia extra.
# DB: OCI Database for PostgreSQL o Autonomous.  IdP: Keycloak en OKE o IAM/IDCS.
# MQ: OCI Streaming (Kafka-compatible).
#
# Identidad del pod: OKE Workload Identity / instance principals.
# =====================================================================================

# Object Storage via API S3-compatible de OCI.
quarkus.amazon.s3.aws.region=${OCI_REGION}
quarkus.amazon.s3.endpoint-override=${OCI_S3_ENDPOINT}
integrationhub.plugin.remote.staging.bucket=${PLUGIN_STAGING_BUCKET}
# OCI S3-compat requiere path-style.
integrationhub.plugin.remote.staging.path-style-access=true

# OCI Streaming habla Kafka: KAFKA_BOOTSTRAP_SERVERS=cell-1.streaming.<region>.oci.oraclecloud.com:9092
