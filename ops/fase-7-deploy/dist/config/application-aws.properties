# =====================================================================================
# Overlay AWS  ->  QUARKUS_PROFILE=prod,aws
#
# Secretos: AWS Secrets Manager (quarkus-amazon-secretsmanager, ya en el pom).
# Staging de plugins remotos: S3 (quarkus-amazon-s3, ya en el pom).
# DB: RDS Postgres.  IdP: Keycloak en EKS o Cognito.  MQ: MSK (Kafka).
#
# Credenciales AWS: NO se ponen aqui. En EKS usar IRSA (IAM Roles for Service Accounts);
# el SDK toma el rol del pod automaticamente. Fuera de EKS, cadena default del SDK.
# =====================================================================================

quarkus.amazon.secretsmanager.aws.region=${AWS_REGION}
quarkus.amazon.s3.aws.region=${AWS_REGION}

# Staging S3 de artefactos de plugins remotos (bucket gestionado, endpoint AWS nativo).
integrationhub.plugin.remote.staging.bucket=${PLUGIN_STAGING_BUCKET}
integrationhub.plugin.remote.staging.path-style-access=false

# Endpoint OTLP: normalmente el sidecar/DaemonSet del ADOT Collector.
# quarkus.otel.exporter.otlp.traces.endpoint se hereda de application-prod (OTEL_OTLP_ENDPOINT).
