quarkus.application.name=audit-consumer
quarkus.http.port=8082

# Mismo Postgres que platform-app (read-model audit_event). El consumidor NO corre
# Flyway: el schema lo posee platform-app.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=admin
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bdtrama

# Consumo del MQ. Kafka es el default; para JMS/RABBITMQ/REDIS fijar
# audit.broker.type y desactivar audit-in con mp.messaging.incoming.audit-in.enabled=false.
audit.topic=audit-events
audit.broker.type=KAFKA
audit.consumer.batch-size=200
audit.consumer.poll.every=1s

# Consumo Kafka. group.id permite escalar replicas del consumidor.
kafka.bootstrap.servers=localhost:9092
mp.messaging.incoming.audit-in.connector=smallrye-kafka
mp.messaging.incoming.audit-in.topic=${audit.topic}
mp.messaging.incoming.audit-in.group.id=audit-consumer
mp.messaging.incoming.audit-in.auto.offset.reset=earliest
mp.messaging.incoming.audit-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# En test el canal usa in-memory (sin Kafka) y el datasource lo da dev services.
%test.mp.messaging.incoming.audit-in.connector=smallrye-in-memory

# Store frio del nivel-registro: POSTGRES (audit_record_event) o CLICKHOUSE (columnar).
audit.cold-store.type=POSTGRES
clickhouse.url=jdbc:clickhouse://localhost:8123/default
clickhouse.username=default
# clickhouse.password ausente = vacio (defaultValue en el producer). No fijar "" presente:
# SmallRye Config rechaza convertir un String vacio y rompe el boot.

rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
redis.host=localhost
redis.port=6379
jms.url=tcp://localhost:61616
