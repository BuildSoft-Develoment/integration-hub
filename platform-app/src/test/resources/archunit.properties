# ADR-021: trinquete de limites motor <-> verticales.
#
# Las violaciones EXISTENTES viven congeladas en platform-app/archunit_store/ (versionado).
# El build falla solo ante una violacion NUEVA: la deuda no crece, aunque todavia no se pague.
#
# allowStoreCreation=true permite crear el store la primera vez (y en un clone sin el).
# Al ARREGLAR una violacion hay que sacarla del store para que no pueda volver:
#   mvn -pl platform-app test -Dtest=VerticalBoundaryArchTest -Darchunit.freeze.refreeze=true
freeze.store.default.allowStoreCreation=true
freeze.store.default.path=archunit_store
