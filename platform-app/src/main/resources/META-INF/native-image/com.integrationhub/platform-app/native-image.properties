# ADR-016 (XlsxWriter, POI SXSSF ESCRITURA): XMLBeans quiere su type-system en BUILD-TIME (es un singleton estatico
# cargado de recursos .xsb). El config original tenia el type-system (metadata.system + TypeSystemHolder) en build-time
# pero los DOCUMENTOS (org.openxmlformats.schemas) en run-time -> inconsistencia: al ESCRIBIR se instancian esos
# Document y quedan en el image heap mientras la clase es run-time -> "object found in image heap". Con solo LECTURA
# (SAX) nunca se instanciaban, por eso pasaba. Fix: poner TODO el arbol de schemas (documentos incluidos) en build-time,
# consistente con su type-system. Los POI utils (LocaleUtil/RandomSingleton/ZipSecureFile/POIXMLTypeLoader) siguen run-time.
Args = --initialize-at-build-time=org.apache.xmlbeans.metadata.system,org.apache.poi.schemas.ooxml.system.ooxml.TypeSystemHolder,org.openxmlformats.schemas,com.microsoft.schemas \
  --initialize-at-run-time=com.jcraft.jsch.JSch,com.jcraft.jsch.Session,com.jcraft.jsch.ChannelSftp \
  --initialize-at-run-time=org.apache.poi.util.LocaleUtil,org.apache.poi.util.RandomSingleton,org.apache.poi.openxml4j.util.ZipSecureFile,org.apache.poi.ooxml.POIXMLTypeLoader \
  --initialize-at-run-time=io.grpc.xds.internal.security \
  -H:DeadlockWatchdogInterval=120 \
  --enable-url-protocols=http,https
