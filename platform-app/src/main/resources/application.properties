quarkus.application.name=integration-hub

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=admin
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/integration_hub

quarkus.hibernate-orm.database.generation=none
# Guard: in dev and CI/test, validate the JPA mapping against the Flyway schema at boot so
# any entity<->column drift (e.g. a camelCase field missing @Column(name)) fails loudly
# instead of only logging. Prod keeps 'none' to avoid boot failures on benign drift.
%dev.quarkus.hibernate-orm.database.generation=validate
%test.quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# Proyecto #3 (opcion B) - staging S3/MinIO para artefactos de plugins remotos. Sin configurar => el source remoto
# por referencia falla-fast (null-object). En dev apunta al MinIO del docker-compose (host 9100, bucket creado por
# minio-init). En prod: bucket/endpoint por config y credenciales via ${secret:...} (Vault), no en claro aqui.
%dev.integrationhub.plugin.remote.staging.bucket=remote-plugin-staging
%dev.integrationhub.plugin.remote.staging.endpoint=http://localhost:9100
%dev.integrationhub.plugin.remote.staging.access-key-id=minioadmin
%dev.integrationhub.plugin.remote.staging.secret-access-key=minioadmin
%dev.integrationhub.plugin.remote.staging.path-style-access=true

quarkus.flyway.migrate-at-start=true

# `flyway.clean()` BORRA todos los objetos de los schemas configurados. Quarkus 3.37.2 lo deja
# HABILITADO por defecto: `FlywayDataSourceRuntimeConfig.cleanDisabled()` lleva
# `@WithDefault("false")` (verificado en el bytecode del jar) y `FlywayCreator` lo pasa explicitamente
# a Flyway, invirtiendo el default seguro que Flyway 10 trae de fabrica.
#
# Y `clean-at-start` es configuracion de RUNTIME sin guarda por modo de arranque: el bytecode de
# `FlywayRecorder` llama a `Flyway.clean()` comprobando UNICAMENTE `isCleanAtStart()`, sin mirar si es
# dev o prod. En el binario nativo eso significa que UNA variable de entorno
# -`QUARKUS_FLYWAY_CLEAN_AT_START=true`- vacia la base en el arranque, con
# `mt101_pay_dispatch_intent` dentro: el ledger que impide pagar dos veces.
#
# Y no es la unica ruta: `doStartActions` tiene una SEGUNDA llamada a `clean()`, bajo
# `isValidateAtStart() && isCleanOnValidationError() && !validationSuccessful`. Es decir, un checksum
# que no cuadra o una migracion que falta -el escenario de un despliegue malo- y Flyway borra la base
# como "remedio". Ambos defaults son false; `FlywayCleanGuard` se niega a arrancar si dejan de serlo.
#
# Se desactiva a nivel de plataforma y se reabre SOLO en dev. Ojo: una variable de entorno gana a este
# fichero (ordinal 300 frente a 250), asi que esto sube el liston pero no cierra la puerta.
quarkus.flyway.clean-disabled=true
%dev.quarkus.flyway.clean-disabled=false

# La puerta la cierra ESTO. `FlywayCleanVetoCallback` corre en `Event.BEFORE_CLEAN`, es decir DENTRO de
# `DbClean.clean()` y ANTES de `CleanExecutor.clean(...)`, que es donde se destruye; el metodo no
# captura excepciones, asi que el veto aborta la operacion con la base intacta.
#
# La diferencia con `clean-disabled` es que `quarkus.flyway.callbacks` es configuracion de BUILD-TIME:
# se resuelve al compilar (`FlywayCallbacksLocator` busca la clase en el indice Jandex y la instancia
# por reflexion con el constructor por defecto), queda cocida en el binario nativo y NINGUNA variable
# de entorno la quita. `clean-disabled` sube el liston; esto es la puerta.
#
# NO replicar esta clave en application-prod.properties: al ser build-time se ignoraria alli, y dejaria
# la falsa sensacion de que prod la tiene declarada. Va aqui, en el modulo que se empaqueta.
quarkus.flyway.callbacks=com.integrationhub.platform.service.FlywayCleanVetoCallback
# ADR-023: cada modulo es dueno de su DDL. El motor versiona db/migration; el vertical SWIFT versiona
# db/migration-mt101 desde su propio modulo. Flyway las mezcla por numero de version y mantiene UN solo
# flyway_schema_history: el historial NO se parte (reescribir 103 entradas rompe instalaciones existentes)
# y no hace falta, porque la propiedad se expresa en donde vive el fichero, no en donde se registra.
quarkus.flyway.locations=classpath:db/migration,classpath:db/migration-mt101

# ADR-023: search_path con los dos schemas, en una sola linea para todos los entornos (dev, integracion
# y prod reciben la URL por vias distintas, asi que ponerlo en la URL exigiria tocar cuatro sitios).
# `public` va primero: es donde estan el motor, staging_record y flyway_schema_history.
# PostgreSQL ignora sin error los schemas del search_path que aun no existen, asi que esto es seguro
# antes de que V500 cree vertical_mt101.
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=public,vertical_mt101

quarkus.oidc.auth-server-url=http://localhost:8180/realms/integration-hub
quarkus.oidc.client-id=integration-hub-api
quarkus.oidc.credentials.secret=change-me
quarkus.oidc.application-type=service

quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.resource.attributes=service.name=integration-hub,service.version=0.0.1-SNAPSHOT

quarkus.native.resources.includes=db/migration/*,META-INF/resources/*,META-INF/services/*
quarkus.native.add-all-charsets=true
# Compresion UPX del binario nativo (UPX 5.1.0 verificado en el builder Mandrel jdk-25).
# Reduce el runner (~305 MB sin comprimir) para distribucion on-premise, a costa de unos
# minutos extra de build y ~decenas de ms de arranque (descompresion en memoria). Solo
# aplica al build nativo con container-build=true (el builder aporta el UPX).
quarkus.native.compression.level=7
quarkus.native.enable-http-url-handler=true
quarkus.native.enable-https-url-handler=true
# [EXPERIMENTO 3.37.2] args nativos previos comentados para probar si los parches de init forzada
# siguen siendo necesarios con componentes alineados. Backup de la linea original:
# quarkus.native.additional-build-args=--initialize-at-run-time=com.jcraft.jsch.JSch,--initialize-at-run-time=com.jcraft.jsch.Session,--initialize-at-run-time=com.jcraft.jsch.ChannelSftp,--initialize-at-run-time=org.apache.poi.util.LocaleUtil,--initialize-at-run-time=org.apache.poi.util.RandomSingleton,--initialize-at-run-time=org.apache.poi.openxml4j.util.ZipSecureFile,--initialize-at-run-time=org.apache.poi.ooxml.POIXMLTypeLoader,--initialize-at-run-time=org.apache.commons.logging.impl.Log4JLogger,-H:DeadlockWatchdogInterval=30,-H:-DeadlockWatchdogExitOnTimeout
# Los args nativos (init build-time/run-time de POI/XMLBeans/jsch, etc.) viven en el archivo autoritativo
# META-INF/native-image/com.integrationhub/platform-app/native-image.properties (ahi se corrigio el TypeSystemHolder
# de OOXML para la ESCRITURA XLSX). Este additional-build-args se deja vacio para no duplicar/entrar en conflicto.
quarkus.native.additional-build-args=

# NOTA nativo: el commons-logging real se excluye por POM en cada fuente (jexl3, artemis/beanutils);
# el shim commons-logging-jboss-logging queda como unica copia de org.apache.commons.logging.
# NO usar quarkus.class-loading.removed-artifacts para esto: banea el recurso por nombre y
# bloquea la clase tambien del shim (rompe la augmentacion de quarkus-amazon-*).

quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.build-dir=dist/browser
quarkus.quinoa.package-manager=npm
quarkus.quinoa.enable-spa-routing=true
# Sin daemon de Nx en el build que lanza Quinoa: el daemon (file-watcher persistente) queda
# vivo tras `nx build` y sus handles sobre frontend/dist hacen fallar el Files.move de Quinoa
# en Windows (AccessDeniedException intermitente ~1/3 builds). El build ya usa --skip-nx-cache,
# asi que el daemon no aporta. En dev-mode no aplica (ahi Quinoa no ejecuta este move).
quarkus.quinoa.package-manager-command.build-env.NX_DAEMON=false
# Build del subpath /appih (opt-in, AISLADO: no afecta dev, que sigue en '/'). Activar con -Dquarkus.profile=appih.
# Hornea el root-path del backend en /appih y le dice a Quinoa que compile el frontend con base-href /appih/
# (script npm build:appih = nx build web --configuration=appih). Se usa para la imagen integration-hub:native-appih.
%appih.quarkus.http.root-path=/appih
%appih.quarkus.quinoa.package-manager-command.build=run build:appih
integrationhub.scheduler.poll-every=30s

# Backend plugins out-of-process (ADR-014). Endpoints no locales deben estar en
# esta allowlist para que el descriptor activo se publique en el registry.
# Formato: https://host[:port],https://otro-host[:port]
integrationhub.plugins.backend.allowed-origins=
# Claves publicas confiables para firmas de plugins trusted=true. El sufijo
# expiresAtUtc es opcional y habilita rotacion por expiracion.
# Formato: keyId:base64(X.509 SubjectPublicKeyInfo EC P-256)[:expiresAtUtc],otro:base64(...)
integrationhub.plugins.backend.trusted-public-keys=
# Revocacion inmediata de claves comprometidas o retiradas.
# Formato: keyId,otroKeyId
integrationhub.plugins.backend.revoked-key-ids=
# Max inbound gRPC message size for remote plugin invocations (bytes). Raises the 4 MiB
# gRPC default so larger Source/Reader payloads fit over the synchronous contract.
integrationhub.plugins.grpc.max-message-bytes=16777216

# La plataforma es CLIENTE gRPC (llama a los plugins remotos) y no EXPONE ningun servicio
# gRPC. Quarkus, por defecto, abria un servidor gRPC en un puerto separado (:9000) que
# colisiona con ClickHouse (dueno legitimo del 9000 en el stack). Se usa el servidor HTTP
# unificado (mismo 8080) en vez de un puerto separado: elimina la colision de raiz sin abrir
# un puerto que no sirve nada. Recomendado por Quarkus.
quarkus.grpc.server.use-separate-server=false

# --- Auditoria asincrona (productor) ---
# La trama se escribe al spool durable (mini-TX propia) y el OutboxRelay la drena
# al MQ. broker.type resuelve la impl del SPI. Sin fallback: si audit.relay.enabled
# es true, el broker configurado debe existir o platform-app falla al arrancar.
audit.topic=audit-events
audit.broker.type=KAFKA
audit.relay.enabled=true
audit.fail-business-on-error=false
audit.relay.batch-size=1000
audit.relay.every=1s

# Retencion automatica del spool: purga filas SENT mas viejas que retention-days
# (el spool es outbox transitorio, no system-of-record). DEAD se conserva.
# Despacho de tareas asincronas por broker (ADR-015). Deshabilitado por defecto: el loop
# completo (dispatch + consumer + resume) se activa por config cuando este verificado.
tasks.dispatch.enabled=false
tasks.relay.every=5s
# F4 (doble check escala): a 1M, 100/5s (~20 msg/s) tardaria ~14h. El relay drena en bucle hasta
# max-batches-per-tick, asi un tick mueve batch-size x max-batches (1000 x 50 = 50k) => ~10k msg/s.
tasks.relay.batch-size=1000
tasks.relay.max-batches-per-tick=50
# F3 (doble check escala): retencion de las tablas async (task_inbox / task_dispatch_outbox). Sin
# esto crecen sin limite a 1M+. Purga SENT/PROCESSED/FAILED por retention-days y DEAD/POISON por
# dead-retention-days (forense acotado). Espejo del cleanup de audit_spool.
tasks.retention.cleanup.enabled=true
tasks.retention.cleanup.every=1h
tasks.retention.cleanup.retention-days=7
tasks.retention.cleanup.dead-retention-days=30
tasks.retention.cleanup.batch=10000
# Gate del despacho async en el motor (ADR-015 Etapa 3): OFF => toda tarea corre sincrona como hoy.
# Opt-in del feature completo (requiere la continuacion de la Etapa 4 para reanudar el proceso).
tasks.async.execution.enabled=false

# Consumer in-process de tareas async (ADR-015 Etapa 5): canal Kafka con suscripcion por patron
# tasks.*. Gated OFF por defecto -> platform-app NO abre un consumer de Kafka salvo activacion
# explicita del feature. La completacion es logica de motor in-process, por eso el consumer vive aqui.
mp.messaging.incoming.tasks-in.connector=smallrye-kafka
mp.messaging.incoming.tasks-in.topic=tasks\\..*
mp.messaging.incoming.tasks-in.pattern=true
mp.messaging.incoming.tasks-in.group.id=platform-app-tasks
mp.messaging.incoming.tasks-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.tasks-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# earliest es OBLIGATORIO con suscripcion por patron: el topic tasks.<tipo> se crea al PRODUCIR
# el primer slice; el consumer lo descubre despues (metadata refresh) y con el default 'latest'
# arrancaria desde el final, SALTEANDOSE ese primer mensaje -> la ejecucion queda SUSPENDED para
# siempre (cazado en el e2e async 2026-07-14).
mp.messaging.incoming.tasks-in.auto.offset.reset=earliest
mp.messaging.incoming.tasks-in.enabled=false
# 3d (operabilidad): estrategia ante nack. El handler ya ACK-ea los desenlaces terminales
# (PROCESSED/FAILED/DEAD/POISON via task_inbox) y solo hace nack en fallo TRANSITORIO de infraestructura.
# 'fail' no pierde datos: no confirma el offset -> se reprocesa tras restart/rebalance. Para mayor
# disponibilidad a volumen, ops puede cambiar a 'dead-letter-queue' (requiere topic DLQ + redrive).
mp.messaging.incoming.tasks-in.failure-strategy=fail
# Retry in-app del consumer ANTES del nack (ride-out de blips transitorios de BD/red): bajo
# failure-strategy=fail un nack detiene el canal entero, así que se reintenta unos intentos con backoff
# lineal antes de nack-ear. Un fallo permanente agota los intentos → nack → halt visible (señal a ops).
tasks.async.consumer.max-attempts=3
tasks.async.consumer.backoff-ms=200
# §5: lease del claim del inbox (owner+expiración). Un efecto largo se mantiene vivo con el heartbeat (F3), que
# renueva el lease cada lease/2 mientras execute() corre → una reentrega (rebalance/crash) no re-toma el claim ni
# duplica el efecto. Dimensionar > al pico esperado de un tick de efecto; heartbeat-threads = pool de renovación.
tasks.async.consumer.claim-lease-seconds=30
tasks.async.consumer.heartbeat-threads=2
# Auto-recuperación de la page-chain del scatter streaming (solo hace falta bajo failure-strategy=
# dead-letter-queue; con 'fail' el restart+redelivery ya reanuda). Gated OFF. Detecta scatters PENDING
# sin progreso por > stall-threshold y re-inyecta su última página.
tasks.async.recovery.enabled=false
tasks.async.recovery.stall-threshold=5m
tasks.async.recovery.every=120s
tasks.async.recovery.max-per-sweep=50
# 3e (operabilidad): refresco de metadata bajo para que el consumer descubra topics tasks.* nuevos
# (creados al publicar el primer work-item de un tipo) con baja latencia.
mp.messaging.incoming.tasks-in.metadata.max.age.ms=2000
# Refresco del snapshot de metricas async (gauges tasks_outbox_* / tasks_inbox_*).
tasks.metrics.refresh.every=30s
# Pool bloqueante del handler (ejecuta el provider + la continuacion, que hacen I/O): requerido por
# @Blocking nombrado aunque el canal este apagado.
# P0-1: max-concurrency=1 (defensa en profundidad). El consumer es @Blocking(ordered=true) -> serial por nodo, del
# que depende la seguridad del claim same-owner del task_inbox (ver AsyncTaskBrokerConsumer). Aunque ordered=true ya
# lo serializa (este valor seria inerte), fijarlo en 1 evita que subir la concurrencia reabra en silencio la ventana
# de doble-efecto. Subirlo EXIGE antes volver el claim seguro ante concurrencia (fencing token / claim-una-vez).
smallrye.messaging.worker.async-task-worker-pool.max-concurrency=1
audit.spool.cleanup.enabled=true
audit.spool.cleanup.every=1h
audit.spool.cleanup.retention-days=7
audit.spool.cleanup.batch=10000
# Retencion del DLQ (poison): mas larga que SENT por ser evidencia operativa.
audit.dead-letter.cleanup.retention-days=30
# Refresco del snapshot de metricas del spool (gauges Prometheus en /q/metrics).
audit.metrics.refresh.every=15s
audit.relay.max-batches-per-tick=10
audit.relay.max-duration-ms=1000
audit.relay.lease-seconds=60
audit.relay.max-attempts=20
audit.relay.backoff-base-ms=1000
audit.relay.backoff-max-ms=300000

# Canal Kafka del SPI (broker por defecto). Otros brokers se enchufan con su
# propia impl de MessageBrokerProvider sin tocar al productor.
kafka.bootstrap.servers=localhost:9092
mp.messaging.outgoing.audit-out.connector=smallrye-kafka
mp.messaging.outgoing.audit-out.topic=${audit.topic}
mp.messaging.outgoing.audit-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.audit-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Solo en test unitario se permite conector in-memory; runtime real exige MQ.
%test.mp.messaging.outgoing.audit-out.connector=smallrye-in-memory

# Conectores MQ adicionales (extensiones native-ready, conexion lazy). Solo conecta el
# broker elegido en audit.broker.type. Cambiar de MQ = cambiar config, no codigo.
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
# Health off (igual que Redis): RabbitMQ es broker opcional/lazy (default KAFKA) y no debe gatear el readiness.
# Ademas el health check de la extension quarkiverse castea el RabbitMQClient (proxy CDI) a RabbitMQClientImpl y
# lanza ClassCastException en dev mode. La app arranca aunque no haya RabbitMQ.
quarkus.rabbitmqclient.health.enabled=false
redis.host=localhost
redis.port=6379
# Cliente Redis de Quarkus (quarkus-redis-client): host/port se derivan de las keys de arriba.
# health off: platform-app tiene smallrye-health y arranca aunque no haya Redis (broker=KAFKA).
quarkus.redis.hosts=redis://${redis.host}:${redis.port}
quarkus.redis.health.enabled=false
jms.url=tcp://localhost:61616
# jms.username / jms.password: ausentes = anonimo (defaultValue vacio en el provider).
# No fijar string vacio aqui: SmallRye Config rechaza convertir "" presente y rompe el boot.
quarkus.log.category."com.integrationhub.platform.service.execution.async".level=INFO
quarkus.log.category."com.integrationhub.platform.service.execution.ProcessExecutionCommandService".level=INFO



# File Vault secret resolution for local/dev
# Example: ${secret:connections/db/conexion1/password}
quarkus.file.vault.provider.dev.path=../secrets/dev-secrets.p12
quarkus.file.vault.provider.dev.secret=change-me
# alias is derived from the logical secret path, e.g. connections/db/conexion1/password -> alias connections/db/conexion1

# Corporate secret manager (HashiCorp Vault / OpenBao, KV v2). Disabled by default.
# Reference syntax: ${vaultkv:area/resource/field} -> reads `field` from KV secret `area/resource`.
# To enable, set enabled=true and provide address + token (leave unset when disabled):
#   integrationhub.secrets.vault.address=https://vault.corp:8200
#   integrationhub.secrets.vault.token=<vault-token>
integrationhub.secrets.vault.enabled=false
integrationhub.secrets.vault.kv-mount=secret

# En DEV apunta al OpenBao del docker-compose (modo dev: desellado, en memoria, token fijo). Solo el
# perfil dev, para no cambiar el comportamiento de prod por levantar un contenedor en localhost.
#
# El token esta en claro porque es el token raiz de un OpenBao efimero de desarrollo: al reiniciar el
# contenedor se pierde todo lo que hubiera dentro. Fuera de dev, ni el token ni el modo valen.
#
# Ojo al diagnosticar: si OpenBao no responde, el token no tiene permiso, o el secreto no existe, el
# cliente devuelve vacio en los tres casos y el error que se ve es siempre el mismo —
# "Missing vaultkv value: <ruta>". Comprobar primero que el contenedor esta arriba.
%dev.integrationhub.secrets.vault.enabled=true
%dev.integrationhub.secrets.vault.address=http://localhost:8200
%dev.integrationhub.secrets.vault.token=dev-root-token

# AWS Secrets Manager. Disabled by default; dev services off so it never spins localstack.
# Reference syntax: ${awssecret:area/resource/field} -> reads `field` from JSON secret `area/resource`.
# To enable, set enabled=true and configure AWS (quarkus.secretsmanager.* / standard AWS chain).
integrationhub.secrets.aws.enabled=false
quarkus.secretsmanager.devservices.enabled=false

# GCP Secret Manager (REST). Disabled by default. ${gcpsecret:secret-name/field}
# Token is short-lived; refresh out-of-band in production.
integrationhub.secrets.gcp.enabled=false
integrationhub.secrets.gcp.base-url=https://secretmanager.googleapis.com

# Azure Key Vault (REST). Disabled by default. ${azuresecret:secret-name/field}
# AAD token is short-lived; refresh out-of-band in production.
integrationhub.secrets.azure.enabled=false
integrationhub.secrets.file-vault.default-provider=dev

# --- MT101 money-path: resolucion normal obligatoria por ambiente (#1) ---
# Gate de DESPLIEGUE (se lee al arranque; cambiarlo exige reiniciar; NO editable desde UI).
# Cuando =true, al PUBLICAR/ACTIVAR un proceso RUNNABLE, cada MT101_PAY debe traer un
# MT101_STATUS(resolveNormalPay=true) POSTERIOR (si no, 400). Encadena tambien: el PAY debe
# tener continueOnFailure=true (G2) y el STATUS el MISMO connectionRef que el PAY (#2-ext).
#
# CRITERIO (depende SOLO de la topologia de confirmacion del ambiente):
#   - Confirmacion ASYNC / ejecucion SEPARADA (la dominante): DEJAR EN false. Encenderlo obliga
#     a un resolutor in-line que corre ANTES de la respuesta del banco -> NEEDS_RECONCILIATION casi
#     en cada corrida.
#   - Confirmacion IN-LINE / lazo cerrado en el MISMO proceso (UAT/prod cerrado): poner =true para
#     garantizar que ningun proceso con MT101_PAY se publique sin su etapa de auto-reconciliacion.
# Default false: no afecta la topologia de ejecucion separada. Se activa por ambiente via env var
# (MT101_PAY_REQUIRE_NORMAL_PAY_RESOLVER=true), -D o este archivo en el deploy correspondiente.
# mt101.pay.require-normal-pay-resolver=false

# --- MT101 build: tope de bytes por batch de INSERT en fase 2 (anti-deadlock pgJDBC H7) ---
# Flush del executeBatch por lo que ocurra primero: nº de filas O bytes acumulados. Default en codigo
# 200KB (property de RUNTIME: overridable sin recompilar, incluso en nativo, via env var
# MT101_BUILD_INSERT_BATCH_MAX_BYTES o -D). Bajar mas si con fragmentos muy grandes reaparece el
# deadlock Client/ClientWrite; subir reduce round-trips pero arriesga el deadlock. Para la evidencia
# de 1.000.000 se probo ~200KB.
# mt101.build.insert-batch-max-bytes=200000

# --- MT101 PAY_CONFLICT acknowledge: maker-checker OPT-IN (segregacion de funciones) ---
# false (default): reconocer un conflicto es single-actor (rol + reason + ticketRef obligatorio + trama append-only
# PAY_CONFLICT_RESOLVED). true: exige DOS pasos con actores DISTINTOS: request-acknowledge (maker, registra la
# intencion sin apagar la alerta) + approve-acknowledge (checker, limpia el flag). NO es fallback: es el modo por
# ambiente (off dev/UAT, ON en prod bancaria). Env: MT101_PAY_CONFLICT_ACKNOWLEDGE_MAKER_CHECKER_ENABLED=true.
# mt101.pay.conflict.acknowledge.maker-checker.enabled=false

# --- MT101 PAY: gate del camino de lista in-memory (no persistido) ---
# true (default, dev/UAT): MT101_PAY sin build_fragment (fragmentSource vacío) puede despachar por el camino de
# lista (re-request-safety por intent, pero sin lineage/conciliación completos). false (prod bancaria, env
# MT101_PAY_DIRECT_LIST_ENABLED=false): ese caso se RECHAZA fail-loud -> obliga el money-path persistido
# (BUILD_FROM_TABLE -> archive -> PAY -> STATUS -> RECONCILE -> PAY_CONFLICT). NO es fallback: modo por ambiente.
# mt101.pay.direct-list.enabled=true


