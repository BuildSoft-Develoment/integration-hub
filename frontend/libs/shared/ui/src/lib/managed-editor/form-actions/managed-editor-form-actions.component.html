@if (!readonly()) {
  <div class="form-actions">
    @if (showTest()) {
      <button mat-stroked-button type="button" (click)="test.emit()" [disabled]="testing()">
        {{ testing() ? i18n.t(testingLabelKey()) : i18n.t(testLabelKey()) }}
      </button>
    }

    <button mat-flat-button type="submit" [disabled]="saving() || !dirty()">
      {{ entityExists() ? i18n.t('common.saveChanges') : i18n.t('common.create') }}
    </button>

    <button mat-stroked-button type="button" (click)="attemptCancel()">
      {{ i18n.t('common.cancel') }}
    </button>
  </div>
}
