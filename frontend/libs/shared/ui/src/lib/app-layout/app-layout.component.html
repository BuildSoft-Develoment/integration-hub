<mat-sidenav-container class="shell-layout">
  <mat-sidenav
    class="shell-sidenav"
    [class.shell-sidenav--compact]="desktopMode() && theme.sidebarMode() === 'compact'"
    [mode]="desktopMode() ? 'side' : 'over'"
    [opened]="desktopMode() || mobileNavOpen()"
    (closedStart)="mobileNavOpen.set(false)"
  >
    <div class="shell-sidenav__inner">
      <div class="brand-block ih-shell-brand">
        @if (theme.logoDataUri(); as logo) {
          <img class="brand-logo" [src]="logo" [alt]="theme.brandName()" />
        } @else {
          <div class="brand-mark">{{ theme.brandMark() }}</div>
        }
        <div class="brand-copy">
          <p class="brand-title">{{ theme.brandName() }}</p>
        </div>
        <div class="brand-actions ih-shell-actions">
          <ih-app-session-action></ih-app-session-action>
          <ih-app-theme-action></ih-app-theme-action>
        </div>
      </div>

      <ih-app-navigation (itemSelected)="closeNavigation()"></ih-app-navigation>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    @if (!auth.ready()) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    <a class="ih-skip-link" href="#main-content" [attr.aria-label]="i18n.t('shell.skipToMain')">{{ i18n.t('shell.skipToMain') }}</a>
    <section class="shell-content">
      @if (!desktopMode()) {
        <div class="mobile-toolbar">
          <button
            mat-icon-button
            type="button"
            class="mobile-nav-button"
            [attr.aria-label]="i18n.t('shell.openNavigation')"
            (click)="toggleNavigation()"
          >
            <span class="hamburger-icon" aria-hidden="true"></span>
          </button>

          <strong class="mobile-toolbar__title">{{ theme.brandName() }}</strong>

          <span class="mobile-toolbar__spacer"></span>

          <ih-app-session-action></ih-app-session-action>
          <ih-app-theme-action></ih-app-theme-action>
        </div>
      }

      <main id="main-content" class="shell-route-body" tabindex="-1">
        @if (breadcrumb.items().length) {
          <ih-breadcrumb [items]="breadcrumb.items()" [backLabel]="breadcrumb.backLabel()" />
        }
        <router-outlet></router-outlet>
      </main>
    </section>
  </mat-sidenav-content>
</mat-sidenav-container>
