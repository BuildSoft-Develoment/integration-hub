<ih-catalog-list
  class="list-card"
  [columns]="columns"
  gridColumns="minmax(180px, 1.3fr) 0.8fr minmax(260px, 1.5fr)"
  [sortField]="sortField()"
  [sortDirection]="sortDirection()"
  [rowCount]="executions().length"
  [loading]="loading()"
  [error]="error()"
  emptyKey="executions.noData"
  emptyIcon="play"
  [total]="totalLength()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="pageSizeOptions()"
  (toggleSort)="toggleSort.emit($event)"
  (pageChange)="onPageChange($event)"
  (retry)="retry.emit()"
>
  @for (execution of executions(); track execution.id) {
    <button
      type="button"
      class="table-row ih-catalog-table-row"
      [class.table-row--selected]="selectedExecutionId() === execution.id"
      [class.ih-catalog-table-row--selected]="selectedExecutionId() === execution.id"
      [attr.aria-label]="execution.processName + ' #' + execution.id"
      [attr.tabindex]="$index === 0 ? 0 : -1"
      [attr.data-row-index]="$index"
      (click)="selectExecution.emit(execution)"
    >
      <div class="row-primary ih-catalog-row-primary">
        <div class="row-avatar ih-catalog-row-avatar ih-tone-integration">
          <ih-icon name="play" [size]="20" />
        </div>
        <div class="row-copy ih-catalog-row-copy">
          <strong>{{ execution.processName }}</strong>
          <small>ID {{ execution.id }} · Proceso {{ execution.processDefinitionId }}</small>
          @if (execution.sourceExecutionId) {
            <small class="row-linkage">Origen #{{ execution.sourceExecutionId }}</small>
          }
        </div>
      </div>

      <div class="row-type ih-catalog-row-meta">
        <mat-chip-set>
          <mat-chip class="status-chip" [class]="'status-chip status-chip--' + statusTone(execution.status)">{{ statusLabel(execution.status) }}</mat-chip>
          @if (execution.triggerSource) {
            <mat-chip>{{ triggerLabel(execution.triggerSource) }}</mat-chip>
          }
        </mat-chip-set>
      </div>

      <div class="row-status ih-catalog-row-meta">
        <div class="row-timing">
          <div class="row-timing__when">
            <span class="row-timing__label">{{ i18n.t('executions.startedAt') }}</span>
            <time class="row-timing__value"
              [attr.datetime]="execution.startedAt"
              [title]="execution.startedAt | ihTime:'absolute'">{{ (execution.startedAt | ihTime:'absolute') || '—' }}</time>
          </div>
          <div class="row-timing__when">
            <span class="row-timing__label">{{ i18n.t('executions.finishedAt') }}</span>
            @if (execution.finishedAt) {
              <time class="row-timing__value"
                [attr.datetime]="execution.finishedAt"
                [title]="execution.finishedAt | ihTime:'absolute'">{{ execution.finishedAt | ihTime:'absolute' }}</time>
            } @else {
              <span class="row-timing__value row-timing__value--pending">{{ i18n.t('executions.running') }}</span>
            }
          </div>
          <div class="row-timing__dur" [class.row-timing__dur--running]="isRunning(execution)">
            <span class="row-timing__label">{{ i18n.t('executions.duration') }}</span>
            <span class="row-timing__value">{{ duration(execution) || '—' }}{{ isRunning(execution) ? '…' : '' }}</span>
          </div>
        </div>
      </div>
    </button>
  }
</ih-catalog-list>
