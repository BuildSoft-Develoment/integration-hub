<div class="list-card ih-catalog-list">
      <div class="table-head ih-catalog-table-head">
        <button type="button" class="col-sortable" (click)="toggleSort.emit('name')">
          {{ i18n.t('common.name') }}
          @if (sortField() === 'name') {
            <span class="sort-arrow">{{ sortDirection() === 'asc' ? '▲' : '▼' }}</span>
          }
        </button>
        <button type="button" class="col-sortable" (click)="toggleSort.emit('status')">
          {{ i18n.t('common.status') }}
          @if (sortField() === 'status') {
            <span class="sort-arrow">{{ sortDirection() === 'asc' ? '▲' : '▼' }}</span>
          }
        </button>
        <button type="button" class="col-sortable" (click)="toggleSort.emit('createdAt')">
          {{ i18n.t('executions.finishedAt') }}
          @if (sortField() === 'createdAt') {
            <span class="sort-arrow">{{ sortDirection() === 'asc' ? '▲' : '▼' }}</span>
          }
        </button>
      </div>

      <div class="table-body ih-catalog-table-body ih-thin-scroll">
        @if (error(); as err) {
          <div class="ih-catalog-error" role="alert">
            <p class="ih-catalog-error__message">{{ i18n.t(err) }}</p>
            <button mat-stroked-button type="button" (click)="retry.emit()">{{ i18n.t('common.retry') }}</button>
          </div>
        }
        @if (loading()) {
          <ih-loading variant="skeleton" [rows]="pageSize()" />
        } @for (execution of executions(); track execution.id) {
          <button
            type="button"
            class="table-row ih-catalog-table-row"
            [class.table-row--selected]="selectedExecutionId() === execution.id"
            [class.ih-catalog-table-row--selected]="selectedExecutionId() === execution.id"
            [attr.aria-label]="execution.processName + ' #' + execution.id"
            [attr.tabindex]="$index === 0 ? 0 : -1"
            [attr.data-row-index]="$index"
            (click)="selectExecution.emit(execution)"
          >
            <div class="row-primary ih-catalog-row-primary">
              <div class="row-avatar ih-catalog-row-avatar ih-tone-integration">
                <ih-icon name="play" [size]="20" />
              </div>
              <div class="row-copy ih-catalog-row-copy">
                <strong>{{ execution.processName }}</strong>
                <small>ID {{ execution.id }} · Proceso {{ execution.processDefinitionId }}</small>
                @if (execution.sourceExecutionId) {
                  <small class="row-linkage">Origen #{{ execution.sourceExecutionId }}</small>
                }
              </div>
            </div>

            <div class="row-type ih-catalog-row-meta">
              <mat-chip-set>
                <mat-chip>{{ statusLabel(execution.status) }}</mat-chip>
                @if (execution.triggerSource) {
                  <mat-chip>{{ triggerLabel(execution.triggerSource) }}</mat-chip>
                }
              </mat-chip-set>
            </div>

            <div class="row-status ih-catalog-row-meta">
              <div class="row-dates">
                <time [attr.datetime]="execution.finishedAt || execution.startedAt" [title]="(execution.finishedAt || execution.startedAt) | ihTime:'absolute'" [attr.aria-label]="(execution.finishedAt || execution.startedAt) | ihTime:'absolute'">{{ (execution.finishedAt || execution.startedAt) | ihTime }}</time>
                <small>{{ i18n.t('executions.startedAt') }} <time [attr.datetime]="execution.startedAt" [title]="execution.startedAt | ihTime:'absolute'" [attr.aria-label]="execution.startedAt | ihTime:'absolute'">{{ execution.startedAt | ihTime }}</time></small>
              </div>
            </div>
          </button>
        } @empty {
          <div class="empty-state ih-catalog-empty-state">
            <ih-icon name="play" [size]="32" />
            <p class="ih-muted">{{ i18n.t('executions.noData') }}</p>
          </div>
        }
      </div>

      @if (totalLength() > 0) {
        <mat-paginator class="list-paginator ih-catalog-paginator" [length]="totalLength()" [pageIndex]="pageIndex()" [pageSize]="pageSize()" [pageSizeOptions]="pageSizeOptions()" [hidePageSize]="false" [showFirstLastButtons]="false" (page)="onPageChange($event)" />
      }
    </div>
