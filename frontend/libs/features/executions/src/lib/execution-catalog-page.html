<section class="page-grid execution-page ih-catalog-grid">
  <mat-drawer-container class="executions-drawer-container ih-catalog-drawer-container">
    <mat-drawer-content>
      <section class="executions-workspace ih-catalog-workspace">
        <ih-execution-toolbar
          [search]="store.search()"
          [modeFilter]="store.modeFilter()"
          [statusFilter]="store.statusFilter()"
          (searchChange)="store.updateSearch($event)"
          (modeFilterChange)="store.updateModeFilter($event)"
          (statusFilterChange)="store.updateStatusFilter($event)"
        />

        <section class="executions-list-shell ih-catalog-list-shell">
          <ih-execution-list
            [executions]="store.pagedExecutions()"
            [totalLength]="store.totalLength()"
            [selectedExecutionId]="store.selectedExecution()?.id ?? null"
            [pageIndex]="store.currentPage()"
            [pageSize]="store.pageSize()"
            (selectExecution)="store.selectExecution($event)"
            (pageChange)="store.updatePagination($event.pageIndex, $event.pageSize)"
          />
        </section>
      </section>
    </mat-drawer-content>

    <mat-drawer class="executions-drawer ih-catalog-drawer" position="end" mode="over" [opened]="store.drawerOpen()" (closedStart)="store.closeDrawer()">
      <ih-execution-editor
        [execution]="store.selectedExecution()"
        [tasks]="store.tasks()"
        [children]="store.children()"
        [navigationStack]="store.navigationStack()"
        [loading]="store.loadingDetails()"
        [actionBusy]="store.actionRunning()"
        (close)="store.closeDrawer()"
        (openExecution)="store.openRelatedExecution($event)"
        (goBack)="store.goBackToPreviousExecution()"
        (fileAction)="store.runFileAction($event)"
      />
    </mat-drawer>
  </mat-drawer-container>
</section>
