<section class="page-grid execution-page ih-catalog-grid">
  <mat-drawer-container class="executions-drawer-container ih-catalog-drawer-container">
    <mat-drawer-content>
      <section class="executions-workspace ih-catalog-workspace">
        <ih-execution-toolbar
          [search]="viewModel().toolbar.search"
          [modeFilter]="viewModel().toolbar.modeFilter"
          [statusFilter]="viewModel().toolbar.statusFilter"
          (searchChange)="updateSearch($event)"
          (modeFilterChange)="updateModeFilter($event)"
          (statusFilterChange)="updateStatusFilter($event)"
        />

        <section class="executions-list-shell ih-catalog-list-shell">
          <ih-execution-list
            [executions]="viewModel().list.executions"
            [totalLength]="viewModel().list.totalLength"
            [selectedExecutionId]="viewModel().list.selectedExecutionId"
            [pageIndex]="viewModel().list.pageIndex"
            [pageSize]="viewModel().list.pageSize"
            (selectExecution)="selectExecution($event)"
            (pageChange)="updatePagination($event.pageIndex, $event.pageSize)"
          />
        </section>
      </section>
    </mat-drawer-content>

    <mat-drawer
      class="executions-drawer ih-catalog-drawer"
      position="end"
      mode="over"
      [opened]="viewModel().editor.opened"
      (closedStart)="closeDrawer()"
    >
      <ih-execution-editor
        [execution]="viewModel().editor.execution"
        [tasks]="viewModel().editor.tasks"
        [children]="viewModel().editor.children"
        [navigationStack]="viewModel().editor.navigationStack"
        [loading]="viewModel().editor.loading"
        [actionBusy]="viewModel().editor.actionBusy"
        (close)="closeDrawer()"
        (openExecution)="openExecution($event)"
        (goBack)="goBack()"
        (fileAction)="runFileAction($event)"
      />
    </mat-drawer>
  </mat-drawer-container>
</section>
