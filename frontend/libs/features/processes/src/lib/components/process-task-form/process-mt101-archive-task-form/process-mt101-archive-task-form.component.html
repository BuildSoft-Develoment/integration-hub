<div class="mt101-archive">
  <header class="mt101-archive__header">
    <h3>{{ i18n.t('processTask.MT101_ARCHIVE') }}</h3>
  </header>

  <section class="mt101-archive__section">
    <h4>{{ i18n.t('mt101Archive.section.destination') }}</h4>
    <div class="mt101-archive__grid">
      <label>
        <span>{{ i18n.t('mt101Archive.connection') }}</span>
        <select
          [ngModel]="draft().connectionRef"
          (ngModelChange)="updateDraft({ connectionRef: $event })"
          [disabled]="readonly()">
          <option value="">—</option>
          @for (c of connections(); track c.id) {
            <option [value]="c.id">{{ c.name }} ({{ c.connectionType }})</option>
          }
        </select>
      </label>
      <label>
        <span>{{ i18n.t('mt101Archive.table') }}</span>
        <input
          type="text"
          [ngModel]="draft().table"
          (ngModelChange)="updateDraft({ table: $event })"
          [disabled]="readonly()" />
      </label>
      <label>
        <span>{{ i18n.t('mt101Archive.hashAlgorithm') }}</span>
        <select
          [ngModel]="draft().hashAlgorithm"
          (ngModelChange)="updateDraft({ hashAlgorithm: $event })"
          [disabled]="readonly()">
          @for (h of hashAlgorithms; track h) {
            <option [value]="h">{{ h }}</option>
          }
        </select>
      </label>
      <label>
        <span>{{ i18n.t('mt101Archive.retentionDays') }}</span>
        <input
          type="number"
          min="1"
          [ngModel]="draft().retentionDays"
          (ngModelChange)="updateDraft({ retentionDays: $event })"
          [disabled]="readonly()" />
      </label>
    </div>
  </section>

  <section class="mt101-archive__section">
    <h4>{{ i18n.t('mt101Archive.section.encryption') }}</h4>
    <label class="mt101-archive__toggle">
      <input
        type="checkbox"
        [ngModel]="draft().encryptionEnabled"
        (ngModelChange)="updateDraft({ encryptionEnabled: $event })"
        [disabled]="readonly()" />
      <span>{{ i18n.t('mt101Archive.encryptionEnabled') }}</span>
    </label>

    @if (draft().encryptionEnabled) {
      <div class="mt101-archive__grid">
        <label>
          <span>{{ i18n.t('mt101Archive.encryptColumn') }}</span>
          <input
            type="text"
            [ngModel]="draft().encryptColumn"
            (ngModelChange)="updateDraft({ encryptColumn: $event })"
            [disabled]="readonly()" />
        </label>
        <label>
          <span>{{ i18n.t('mt101Archive.encryptionSecretRef') }}</span>
          <input
            type="text"
            placeholder="${secret:archive_key}"
            [ngModel]="draft().encryptionSecretRef"
            (ngModelChange)="updateDraft({ encryptionSecretRef: $event })"
            [disabled]="readonly()" />
        </label>
      </div>
    }
  </section>
</div>
