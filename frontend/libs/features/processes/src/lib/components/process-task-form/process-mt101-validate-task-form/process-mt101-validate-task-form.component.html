<div class="mt101-validate">
  <header class="mt101-validate__header">
    <h3>{{ i18n.t('processTask.MT101_VALIDATE') }}</h3>
  </header>

  <ih-process-task-runtime-panel
    [task]="task()"
    [tasks]="tasks()"
    [draft]="draft()"
    [readonly]="readonly()"
    (runtimeChange)="updateDraft($event)"
  />

  <section class="mt101-validate__section">
    <h4>{{ i18n.t('mt101Validate.section.rules') }}</h4>
    <div class="mt101-validate__grid">
      <label>
        <span>{{ i18n.t('mt101Validate.ruleSet') }}</span>
        <input
          type="text"
          [ngModel]="draft().ruleSet"
          (ngModelChange)="updateDraft({ ruleSet: $event })"
          [disabled]="readonly()" />
      </label>
      <label>
        <span>{{ i18n.t('mt101Validate.standard') }}</span>
        <select
          [ngModel]="draft().standard"
          (ngModelChange)="updateDraft({ standard: $event })"
          [disabled]="readonly()">
          @for (s of standards; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </label>
      <label>
        <span>{{ i18n.t('mt101Validate.appliesTo') }}</span>
        <input
          type="text"
          [ngModel]="draft().appliesTo"
          (ngModelChange)="updateDraft({ appliesTo: $event })"
          [disabled]="readonly()" />
      </label>
      <label>
        <span>{{ i18n.t('mt101Validate.businessCalendar') }}</span>
        <select
          [ngModel]="draft().businessCalendar"
          (ngModelChange)="updateDraft({ businessCalendar: $event })"
          [disabled]="readonly()">
          @for (c of calendars; track c) {
            <option [value]="c">{{ c }}</option>
          }
        </select>
      </label>
    </div>
  </section>

  <section class="mt101-validate__section">
    <h4>{{ i18n.t('mt101Validate.section.policy') }}</h4>
    <div class="mt101-validate__grid">
      <label>
        <span>{{ i18n.t('mt101Validate.failOn') }}</span>
        <select
          [ngModel]="draft().failOn"
          (ngModelChange)="updateDraft({ failOn: $event })"
          [disabled]="readonly()">
          @for (s of severities; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </label>
    </div>
  </section>

  <section class="mt101-validate__section">
    <h4>{{ i18n.t('mt101Validate.section.publishIssues') }}</h4>
    <div class="mt101-validate__grid">
      <label>
        <span>{{ i18n.t('mt101Validate.publishIssuesConnection') }}</span>
        <select
          [ngModel]="draft().publishIssuesConnectionRef"
          (ngModelChange)="updateDraft({ publishIssuesConnectionRef: $event })"
          [disabled]="readonly()">
          <option value="">-</option>
          @for (c of connections(); track c.id) {
            <option [value]="c.id">{{ c.name }} ({{ c.connectionType }})</option>
          }
        </select>
      </label>
      <label>
        <span>{{ i18n.t('mt101Validate.publishIssuesTable') }}</span>
        <input
          type="text"
          [ngModel]="draft().publishIssuesTable"
          (ngModelChange)="updateDraft({ publishIssuesTable: $event })"
          [disabled]="readonly()" />
      </label>
    </div>
  </section>
</div>
