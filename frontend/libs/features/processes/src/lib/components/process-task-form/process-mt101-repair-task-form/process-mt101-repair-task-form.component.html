<div class="mt101-repair">
  <header class="mt101-repair__header">
    <h3>{{ i18n.t('processTask.MT101_REPAIR') }}</h3>
  </header>

  <ih-process-task-runtime-panel
    [task]="task()"
    [tasks]="tasks()"
    [draft]="draft()"
    [readonly]="readonly()"
    (runtimeChange)="updateDraft($event)"
  />

  <p class="mt101-repair__description">{{ i18n.t('mt101Repair.description') }}</p>

  <section class="mt101-repair__section">
    <h4>{{ i18n.t('mt101Repair.section.repairs') }}</h4>
    <ul class="mt101-repair__list">
      @for (repair of draft().repairs; let i = $index; track i) {
        <li class="mt101-repair__item">
          <div class="mt101-repair__row">
            <label>
              <span>{{ i18n.t('mt101Repair.action') }}</span>
              <select
                [ngModel]="repair.action"
                (ngModelChange)="updateRepair(i, { action: $event })"
                [disabled]="readonly()">
                @for (a of actions; track a) {
                  <option [value]="a">{{ a }}</option>
                }
              </select>
            </label>
            @if (repair.action === 'truncateField') {
              <label>
                <span>{{ i18n.t('mt101Repair.maxLength') }}</span>
                <input
                  type="number"
                  min="1"
                  [ngModel]="repair.maxLength"
                  (ngModelChange)="updateRepair(i, { maxLength: $event })"
                  [disabled]="readonly()" />
              </label>
            }
            <button
              type="button"
              class="mt101-repair__remove"
              (click)="removeRepair(i)"
              [disabled]="readonly() || draft().repairs.length === 1">
              ✕
            </button>
          </div>
          <label class="mt101-repair__full">
            <span>{{ i18n.t('mt101Repair.targetFields') }}</span>
            <textarea
              rows="3"
              placeholder="transactions.remittanceInformation&#10;transactions.beneficiary.nameAndAddress"
              [ngModel]="repair.targetFields"
              (ngModelChange)="updateRepair(i, { targetFields: $event })"
              [disabled]="readonly()"></textarea>
          </label>
        </li>
      }
    </ul>
    <button type="button" class="mt101-repair__add" (click)="addRepair()" [disabled]="readonly()">
      + {{ i18n.t('mt101Repair.addRepair') }}
    </button>
  </section>

  <section class="mt101-repair__section">
    <h4>{{ i18n.t('mt101Repair.section.tracking') }}</h4>
    <div class="mt101-repair__grid">
      <label class="mt101-repair__col-2">
        <span>{{ i18n.t('mt101Repair.newReferenceTemplate') }}</span>
        <input
          type="text"
          placeholder="${sendersReference}-R${repairAttempt}"
          [ngModel]="draft().newReferenceTemplate"
          (ngModelChange)="updateDraft({ newReferenceTemplate: $event })"
          [disabled]="readonly()" />
      </label>
      <label>
        <span>{{ i18n.t('mt101Repair.repairAttempt') }}</span>
        <input
          type="number"
          min="1"
          [ngModel]="draft().repairAttempt"
          (ngModelChange)="updateDraft({ repairAttempt: $event })"
          [disabled]="readonly()" />
      </label>
    </div>
  </section>
</div>
