<div class="mt101-status">
  <header class="mt101-status__header">
    <h3>{{ i18n.t('processTask.MT101_STATUS') }}</h3>
    <label class="mt101-status__inline">
      <span>{{ i18n.t('mt101Status.mode') }}</span>
      <select
        [ngModel]="draft().mode"
        (ngModelChange)="updateDraft({ mode: $event })"
        [disabled]="readonly()">
        @for (m of modes; track m) {
          <option [value]="m">{{ m }}</option>
        }
      </select>
    </label>
  </header>

  @if (draft().mode === 'query') {
    <section class="mt101-status__section">
      <h4>{{ i18n.t('mt101Status.section.query') }}</h4>
      <div class="mt101-status__grid">
        <label class="mt101-status__col-2">
          <span>{{ i18n.t('mt101Status.query.url') }}</span>
          <input
            type="text"
            placeholder="https://gateway.banco/v1/swift/status/${gatewayReference}"
            [ngModel]="draft().queryUrl"
            (ngModelChange)="updateDraft({ queryUrl: $event })"
            [disabled]="readonly()" />
        </label>
        <label>
          <span>{{ i18n.t('mt101Status.query.method') }}</span>
          <select
            [ngModel]="draft().queryMethod"
            (ngModelChange)="updateDraft({ queryMethod: $event })"
            [disabled]="readonly()">
            @for (m of httpMethods; track m) {
              <option [value]="m">{{ m }}</option>
            }
          </select>
        </label>
        <label>
          <span>{{ i18n.t('mt101Status.query.timeoutSeconds') }}</span>
          <input
            type="number"
            min="1"
            [ngModel]="draft().queryTimeoutSeconds"
            (ngModelChange)="updateDraft({ queryTimeoutSeconds: $event })"
            [disabled]="readonly()" />
        </label>
      </div>
    </section>
  } @else {
    <p class="mt101-status__notice">
      {{ i18n.t('mt101Status.modeRequiresM2') }}: <code>{{ draft().mode }}</code>
    </p>
  }

  <section class="mt101-status__section">
    <h4>{{ i18n.t('mt101Status.section.response') }}</h4>
    <div class="mt101-status__grid">
      <label>
        <span>{{ i18n.t('mt101Status.statusField') }}</span>
        <input
          type="text"
          [ngModel]="draft().statusField"
          (ngModelChange)="updateDraft({ statusField: $event })"
          [disabled]="readonly()" />
      </label>
      <label>
        <span>{{ i18n.t('mt101Status.referenceField') }}</span>
        <input
          type="text"
          [ngModel]="draft().referenceField"
          (ngModelChange)="updateDraft({ referenceField: $event })"
          [disabled]="readonly()" />
      </label>
      <label class="mt101-status__col-2">
        <span>{{ i18n.t('mt101Status.errorMessageField') }}</span>
        <input
          type="text"
          [ngModel]="draft().errorMessageField"
          (ngModelChange)="updateDraft({ errorMessageField: $event })"
          [disabled]="readonly()" />
      </label>
    </div>
  </section>

  <section class="mt101-status__section">
    <h4>{{ i18n.t('mt101Status.section.persistence') }}</h4>
    <div class="mt101-status__grid">
      <label>
        <span>{{ i18n.t('mt101Status.connection') }}</span>
        <select
          [ngModel]="draft().connectionRef"
          (ngModelChange)="updateDraft({ connectionRef: $event })"
          [disabled]="readonly()">
          <option value="">—</option>
          @for (c of connections(); track c.id) {
            <option [value]="c.id">{{ c.name }} ({{ c.connectionType }})</option>
          }
        </select>
      </label>
      <label>
        <span>{{ i18n.t('mt101Status.confirmationTable') }}</span>
        <input
          type="text"
          [ngModel]="draft().confirmationTable"
          (ngModelChange)="updateDraft({ confirmationTable: $event })"
          [disabled]="readonly()" />
      </label>
    </div>
  </section>
</div>
