<div class="mt101-route">
  <header class="mt101-route__header">
    <h3>{{ i18n.t('processTask.MT101_ROUTE') }}</h3>
  </header>

  <ih-process-task-runtime-panel
    [task]="task()"
    [tasks]="tasks()"
    [draft]="draft()"
    [readonly]="readonly()"
    (runtimeChange)="updateDraft($event)"
  />

  <section class="mt101-route__section">
    <h4>{{ i18n.t('mt101Route.section.rules') }}</h4>
    <p class="mt101-route__hint">{{ i18n.t('mt101Route.predicateHint') }}</p>
    <ul class="mt101-route__rules">
      @for (rule of draft().rules; let i = $index; track i) {
        <li class="mt101-route__rule">
          <label>
            <span>{{ i18n.t('mt101Route.rule.name') }}</span>
            <input
              type="text"
              [ngModel]="rule.name"
              (ngModelChange)="updateRule(i, { name: $event })"
              [disabled]="readonly()" />
          </label>
          <label class="mt101-route__rule-predicate">
            <span>{{ i18n.t('mt101Route.rule.predicate') }}</span>
            <input
              type="text"
              placeholder="beneficiaryBic == 'BCPLPEPL'"
              [ngModel]="rule.predicate"
              (ngModelChange)="updateRule(i, { predicate: $event })"
              [disabled]="readonly()" />
          </label>
          <label>
            <span>{{ i18n.t('mt101Route.rule.routeTo') }}</span>
            <input
              type="text"
              [ngModel]="rule.routeTo"
              (ngModelChange)="updateRule(i, { routeTo: $event })"
              [disabled]="readonly()" />
          </label>
          <button
            type="button"
            class="mt101-route__rule-remove"
            (click)="removeRule(i)"
            [disabled]="readonly() || draft().rules.length === 1">
            ✕
          </button>
        </li>
      }
    </ul>
    <button type="button" class="mt101-route__add" (click)="addRule()" [disabled]="readonly()">
      + {{ i18n.t('mt101Route.addRule') }}
    </button>
  </section>

  <section class="mt101-route__section">
    <h4>{{ i18n.t('mt101Route.section.fallback') }}</h4>
    <div class="mt101-route__grid">
      <label>
        <span>{{ i18n.t('mt101Route.defaultRoute') }}</span>
        <input
          type="text"
          [ngModel]="draft().defaultRoute"
          (ngModelChange)="updateDraft({ defaultRoute: $event })"
          [disabled]="readonly()" />
      </label>
      <label>
        <span>{{ i18n.t('mt101Route.routeField') }}</span>
        <input
          type="text"
          [ngModel]="draft().routeField"
          (ngModelChange)="updateDraft({ routeField: $event })"
          [disabled]="readonly()" />
      </label>
    </div>
  </section>
</div>
