<ih-task-form-shell [title]="i18n.t('processTask.DB_EXECUTE_FN')">
  <ih-process-task-runtime-panel
    shellRuntime
    [task]="task()"
    [tasks]="tasks()"
    [draft]="draft()"
    [readonly]="readonly()"
    (runtimeChange)="updateDraft($event)"
  />

  <div class="tfs-body">
    <div class="task-grid">
      <ih-connection-select
        [connections]="connections()"
        [value]="draft().connectionRef"
        [label]="i18n.t('ui.connection')"
        [emptyLabel]="i18n.t('ui.platformDatasource')"
        [disabled]="readonly()"
        (valueChange)="handleConnectionChange($event)" />

      <mat-form-field>
        <mat-label>{{ i18n.t('ui.schema') }}</mat-label>
        <mat-select [disabled]="readonly() || !selectedConnection()" [ngModel]="functionSchema()" (ngModelChange)="handleSchemaChange($event)">
          <mat-option value="">{{ i18n.t('ui.allSchemas') }}</mat-option>
          @for (schema of schemas(); track schema.name) {
            <mat-option [value]="schema.name">{{ schema.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <ih-process-db-routine-selector
        [labelKey]="'ui.functionName'"
        [disabled]="readonly() || !selectedConnection()"
        [query]="routineQuery()"
        [routines]="routines()"
        (queryChange)="handleRoutineQueryChange($event)"
        (routineSelect)="handleRoutineSelect($event)"
      />

      <mat-form-field>
        <mat-label>{{ i18n.t('ui.functionResultAlias') }}</mat-label>
        <input matInput [disabled]="readonly()" [ngModel]="draft().resultAlias" (ngModelChange)="updateDraft({ resultAlias: $event })" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>{{ i18n.t('ui.timeoutSeconds') }}</mat-label>
        <input matInput [disabled]="readonly()" [ngModel]="draft().timeoutSeconds" (ngModelChange)="updateDraft({ timeoutSeconds: $event })" />
      </mat-form-field>
    </div>

    <ih-process-task-binding-board
      [entries]="draft().parameters"
      [sourceGroups]="groupedSources()"
      [showSourcePalette]="true"
      [readonly]="readonly()"
      [showDirection]="false"
      [showAddAction]="false"
      [showRemoveAction]="false"
      [scrollRows]="true"
      [layout]="'routine-compact'"
      [compactScrollThreshold]="3"
      [titleKey]="'ui.functionParameters'"
      [hintKey]="'ui.functionParametersHint'"
      [nameLabelKey]="'ui.parameterName'"
      (entriesChange)="updateDraft({ parameters: $event })"
    />
  </div>
</ih-task-form-shell>
