<div class="mt101-reconcile">
  <header class="mt101-reconcile__header">
    <h3>{{ i18n.t('processTask.MT101_RECONCILE') }}</h3>
  </header>

  <section class="mt101-reconcile__section">
    <h4>{{ i18n.t('mt101Reconcile.section.source') }}</h4>
    <div class="mt101-reconcile__grid">
      <label>
        <span>{{ i18n.t('mt101Reconcile.connection') }}</span>
        <select
          [ngModel]="draft().connectionRef"
          (ngModelChange)="updateDraft({ connectionRef: $event })"
          [disabled]="readonly()">
          <option value="">—</option>
          @for (c of connections(); track c.id) {
            <option [value]="c.id">{{ c.name }} ({{ c.connectionType }})</option>
          }
        </select>
      </label>
      <label>
        <span>{{ i18n.t('mt101Reconcile.sentTable') }}</span>
        <input
          type="text"
          [ngModel]="draft().sentTable"
          (ngModelChange)="updateDraft({ sentTable: $event })"
          [disabled]="readonly()" />
      </label>
      <label>
        <span>{{ i18n.t('mt101Reconcile.confirmationTable') }}</span>
        <input
          type="text"
          [ngModel]="draft().confirmationTable"
          (ngModelChange)="updateDraft({ confirmationTable: $event })"
          [disabled]="readonly()" />
      </label>
      <label>
        <span>{{ i18n.t('mt101Reconcile.matchKeys') }}</span>
        <input
          type="text"
          placeholder="senders_reference,uetr"
          [ngModel]="draft().matchKeys"
          (ngModelChange)="updateDraft({ matchKeys: $event })"
          [disabled]="readonly()" />
      </label>
    </div>
  </section>

  <section class="mt101-reconcile__section">
    <h4>{{ i18n.t('mt101Reconcile.section.window') }}</h4>
    <div class="mt101-reconcile__grid">
      <label>
        <span>{{ i18n.t('mt101Reconcile.asOfDate') }}</span>
        <input
          type="text"
          placeholder="2026-06-09 / ${today}"
          [ngModel]="draft().asOfDate"
          (ngModelChange)="updateDraft({ asOfDate: $event })"
          [disabled]="readonly()" />
      </label>
      <label>
        <span>{{ i18n.t('mt101Reconcile.lookbackDays') }}</span>
        <input
          type="number"
          min="0"
          [ngModel]="draft().lookbackDays"
          (ngModelChange)="updateDraft({ lookbackDays: $event })"
          [disabled]="readonly()" />
      </label>
    </div>
  </section>

  <section class="mt101-reconcile__section">
    <h4>{{ i18n.t('mt101Reconcile.section.exceptions') }}</h4>
    <div class="mt101-reconcile__grid">
      <label>
        <span>{{ i18n.t('mt101Reconcile.exceptionConnection') }}</span>
        <select
          [ngModel]="draft().exceptionConnectionRef"
          (ngModelChange)="updateDraft({ exceptionConnectionRef: $event })"
          [disabled]="readonly()">
          <option value="">—</option>
          @for (c of connections(); track c.id) {
            <option [value]="c.id">{{ c.name }} ({{ c.connectionType }})</option>
          }
        </select>
      </label>
      <label>
        <span>{{ i18n.t('mt101Reconcile.exceptionTable') }}</span>
        <input
          type="text"
          [ngModel]="draft().exceptionTable"
          (ngModelChange)="updateDraft({ exceptionTable: $event })"
          [disabled]="readonly()" />
      </label>
    </div>
  </section>
</div>
