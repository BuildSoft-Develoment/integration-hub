<ih-task-form-shell [title]="i18n.t('processTask.FILE_DELIVER')">
  <ih-process-task-runtime-panel
    shellRuntime
    [task]="task()"
    [tasks]="tasks()"
    [draft]="draft()"
    [readonly]="readonly()"
    [executionModes]="executionModes"
    (runtimeChange)="updateDraft($event)"
  />

  <div class="tfs-body">
    <div class="task-grid">
    <mat-form-field>
      <mat-label>{{ i18n.t('ui.deliver.sink') }}</mat-label>
      <mat-select [disabled]="readonly()" [ngModel]="draft().sinkRef" (ngModelChange)="updateDraft({ sinkRef: $event })">
        <mat-option value="">{{ i18n.t('ui.deliver.selectSink') }}</mat-option>
        @for (sink of sinkOptions(); track sink.id) {
          <mat-option [value]="sink.id">{{ sink.id }} - {{ sink.name }}</mat-option>
        }
      </mat-select>
      <mat-hint>{{ i18n.t('ui.deliver.sinkHint') }}</mat-hint>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>{{ i18n.t('ui.deliver.dropPathTemplate') }}</mat-label>
      <input matInput [disabled]="readonly()" [ngModel]="draft().dropPathTemplate" (ngModelChange)="updateDraft({ dropPathTemplate: $event })" placeholder="/outbox/${originalName}" />
      <mat-hint>{{ i18n.t('ui.deliver.dropPathHint') }}</mat-hint>
    </mat-form-field>
    </div>
  </div>
</ih-task-form-shell>
