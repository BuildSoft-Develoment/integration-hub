<div class="task-modal-backdrop" (click)="close.emit()"></div>

    <section
      class="task-modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="task-modal-title"
      cdkTrapFocus
      cdkTrapFocusAutoCapture
      (click)="$event.stopPropagation()"
    >
      <header class="task-modal-header">
        <div class="task-modal-copy">
          <h3 id="task-modal-title">{{ i18n.t('ui.task', { index: index() + 1 }) }}</h3>
          <p class="task-modal-summary">{{ taskTypeLabel(task().taskType) }}</p>
        </div>

        <div class="task-modal-actions">
          <button mat-icon-button type="button" (click)="close.emit()" [attr.aria-label]="i18n.t('common.close')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6 18 18M18 6 6 18" />
            </svg>
          </button>
        </div>
      </header>

      <div
        class="task-modal-body"
        [class.task-modal-body--workspace]="modalLayout() === 'workspace' || modalLayout() === 'rest'"
        [class.task-modal-body--rest]="modalLayout() === 'rest'"
      >
        <section
          class="task-modal-section"
          [class.task-modal-section--workspace]="modalLayout() === 'workspace' || modalLayout() === 'rest'"
          [class.task-modal-section--rest]="modalLayout() === 'rest'"
        >
          <ih-process-task-form-host
            [task]="task()"
            [tasks]="tasks()"
            [sources]="sources()"
            [readers]="readers()"
            [connections]="connections()"
            [readonly]="readonly()"
            (patchTask)="patchTask.emit($event)"
          />
        </section>
      </div>
    </section>
