<section class="page-grid process-page ih-no-hint">
  <mat-drawer-container class="processes-drawer-container">
    <mat-drawer-content [class.processes-content-hidden]="viewModel().drawerOpen">
      <section class="processes-workspace">
        <ih-process-toolbar
          [search]="viewModel().toolbar.search"
          [scheduleFilter]="viewModel().toolbar.scheduleFilter"
          [statusFilter]="viewModel().toolbar.statusFilter"
          [canEdit]="viewModel().toolbar.canEdit"
          (searchChange)="updateSearch($event)"
          (scheduleFilterChange)="updateScheduleFilter($event)"
          (statusFilterChange)="updateStatusFilter($event)"
          (create)="createProcess()"
        />

        <section class="processes-list-shell">
          <ih-process-list
            [processes]="viewModel().list.processes"
            [totalLength]="viewModel().list.totalLength"
            [selectedProcessId]="viewModel().list.selectedProcessId"
            [sortField]="store.sortField()"
            [sortDirection]="store.sortDirection()"
            [pageIndex]="viewModel().list.pageIndex"
            [pageSize]="viewModel().list.pageSize"
            [loading]="store.loading()"
            [error]="store.error()"
            (selectProcess)="selectProcess($event)"
            (toggleSort)="store.toggleSort($event)"
            (pageChange)="updatePagination($event)"
            (retry)="retryLoad()"
          />
        </section>
      </section>
    </mat-drawer-content>

    <mat-drawer class="processes-drawer" position="end" mode="over" [opened]="viewModel().drawerOpen" (closedStart)="closeDrawer()">
      <ih-process-editor
        [form]="viewModel().editor.form"
        [sources]="viewModel().editor.sources"
        [readers]="viewModel().editor.readers"
        [connections]="viewModel().editor.connections"
        [titleKey]="viewModel().editor.titleKey"
        [saving]="viewModel().editor.saving"
        [executing]="viewModel().editor.executing"
        [dirty]="viewModel().editor.dirty"
        [readonly]="viewModel().editor.readonly"
        [canEdit]="viewModel().editor.canEdit"
        [canOperate]="viewModel().editor.canOperate"
        (patchForm)="patchForm($event)"
        (flowLayoutChange)="applyFlowLayout($event)"
        (addTask)="addTask($event)"
        (addTaskAt)="addTaskAt($event)"
        (applyMassiveTemplate)="applyMassiveTemplate()"
        (patchTask)="patchTask($event)"
        (flowStateChange)="applyFlowState($event)"
        (removeTask)="removeTask($event)"
        (save)="saveProcess()"
        (cancel)="cancelEdit()"
        (close)="closeDrawer()"
        (edit)="editSelectedProcess()"
        (toggleActive)="toggleSelectedProcess()"
        (execute)="executeSelectedProcess()"
      />
    </mat-drawer>
  </mat-drawer-container>
</section>
