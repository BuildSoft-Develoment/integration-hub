<section class="page-grid schedule-page ih-catalog-grid ih-no-hint">
  @let vm = viewModel();
  <mat-drawer-container class="schedules-drawer-container ih-catalog-drawer-container">
    <mat-drawer-content>
      <section class="schedules-workspace ih-catalog-workspace">
        <ih-schedules-toolbar
          [search]="vm.search"
          [modeFilter]="vm.modeFilter"
          [statusFilter]="vm.statusFilter"
          (searchChange)="updateSearch($event)"
          (modeFilterChange)="updateModeFilter($event)"
          (statusFilterChange)="updateStatusFilter($event)"
          (refresh)="refresh()"
        />

        <section class="schedules-list-shell ih-catalog-list-shell">
          <ih-schedules-list
            [schedules]="vm.schedules"
            [totalLength]="vm.totalLength"
            [selectedScheduleId]="vm.selectedSchedule?.id ?? null"
            [sortField]="vm.sortField"
            [sortDirection]="vm.sortDirection"
            [pageIndex]="vm.pageIndex"
            [pageSize]="vm.pageSize"
            [loading]="vm.loading"
            [error]="vm.error"
            (selectSchedule)="selectSchedule($event)"
            (toggleSort)="store.toggleSort($event)"
            (pageChange)="updatePagination($event)"
            (retry)="refresh()"
          />
        </section>
      </section>
    </mat-drawer-content>

    <mat-drawer class="schedules-drawer ih-catalog-drawer" position="end" mode="over" [opened]="vm.drawerOpen" (closedStart)="closeDrawer()">
      <ih-schedules-editor
        [schedule]="vm.selectedSchedule"
        [executing]="vm.executing"
        [canOperate]="vm.canOperate"
        (close)="closeDrawer()"
        (run)="runSelected()"
        (openProcesses)="openProcesses()"
      />
    </mat-drawer>
  </mat-drawer-container>
</section>
