<section class="page-grid schedule-page ih-catalog-grid">
  <mat-drawer-container class="schedules-drawer-container ih-catalog-drawer-container">
    <mat-drawer-content>
      <section class="schedules-workspace ih-catalog-workspace">
        <ih-schedules-toolbar
          [search]="store.search()"
          [modeFilter]="store.modeFilter()"
          [statusFilter]="store.statusFilter()"
          (searchChange)="store.updateSearch($event)"
          (modeFilterChange)="store.updateModeFilter($event)"
          (statusFilterChange)="store.updateStatusFilter($event)"
          (refresh)="store.load()"
        />

        <section class="schedules-list-shell ih-catalog-list-shell">
          <ih-schedules-list
            [schedules]="store.pagedSchedules()"
            [totalLength]="store.filteredSchedules().length"
            [selectedScheduleId]="store.selectedSchedule()?.id ?? null"
            [pageIndex]="store.currentPage()"
            [pageSize]="store.pageSize()"
            (selectSchedule)="store.selectSchedule($event)"
            (pageChange)="store.updatePagination($event.pageIndex, $event.pageSize)"
          />
        </section>
      </section>
    </mat-drawer-content>

    <mat-drawer class="schedules-drawer ih-catalog-drawer" position="end" mode="over" [opened]="store.drawerOpen()" (closedStart)="store.closeDrawer()">
      <ih-schedules-editor
        [schedule]="store.selectedSchedule()"
        [executing]="store.executing()"
        [canOperate]="store.canOperate()"
        (close)="store.closeDrawer()"
        (run)="store.selectedSchedule() && store.execute(store.selectedSchedule()!)"
      />
    </mat-drawer>
  </mat-drawer-container>
</section>
