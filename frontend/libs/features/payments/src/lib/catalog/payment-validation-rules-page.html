<section class="page-grid payment-rules-page ih-catalog-grid ih-no-hint">
  <mat-drawer-container class="rules-drawer-container ih-catalog-drawer-container">
    <mat-drawer-content>
      <section class="rules-workspace ih-catalog-workspace">
        <ih-payment-rules-toolbar />

        <section class="rules-list-shell ih-catalog-list-shell">
          <ih-payment-rules-list />
        </section>
      </section>
    </mat-drawer-content>

    <mat-drawer
      class="rules-drawer ih-catalog-drawer"
      position="end"
      mode="over"
      [opened]="store.drawerOpen()"
      (closedStart)="store.closeDrawer()"
    >
      <ih-payment-rules-editor />
    </mat-drawer>
  </mat-drawer-container>
</section>
