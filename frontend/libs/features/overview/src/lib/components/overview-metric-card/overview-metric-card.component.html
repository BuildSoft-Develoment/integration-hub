<article class="metric-card">
  <p class="metric-label">{{ i18n.t(titleKey()) }}</p>
  <strong class="metric-value">{{ value() }}</strong>
  @if (activeCount() !== null) {
    <p class="metric-detail ih-muted">{{ i18n.t('overview.metric.activeDetail', { count: activeCount()! }) }}</p>
  }
</article>
