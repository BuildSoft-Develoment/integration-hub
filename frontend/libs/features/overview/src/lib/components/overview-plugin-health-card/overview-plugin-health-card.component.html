<article
  class="plugin-health-card"
  [class.plugin-health-card--warn]="alert() === 'warn'"
  [class.plugin-health-card--error]="alert() === 'error'"
>
  <p class="metric-label">
    @if (alert()) {
      <ih-icon name="alert-triangle" class="metric-alert-icon" />
    }
    {{ i18n.t('overview.plugins.title') }}
  </p>

  <dl class="plugin-health-stats">
    <div class="plugin-health-stat">
      <dt>{{ i18n.t('overview.plugins.active') }}</dt>
      <dd class="plugin-health-value plugin-health-value--active">{{ health().active }}</dd>
    </div>
    <div class="plugin-health-stat">
      <dt>{{ i18n.t('overview.plugins.degraded') }}</dt>
      <dd class="plugin-health-value plugin-health-value--degraded">{{ health().degraded }}</dd>
    </div>
    <div class="plugin-health-stat">
      <dt>{{ i18n.t('overview.plugins.blocked') }}</dt>
      <dd class="plugin-health-value plugin-health-value--blocked">{{ health().blocked }}</dd>
    </div>
  </dl>

  <a mat-button class="metric-action" [routerLink]="['/plugins']">
    {{ i18n.t('overview.action.viewPlugins') }} →
  </a>
</article>
