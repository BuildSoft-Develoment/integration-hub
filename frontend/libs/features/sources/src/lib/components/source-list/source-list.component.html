<div class="list-card ih-catalog-list">
      <div class="table-head ih-catalog-table-head">
        <button type="button" class="col-sortable" (click)="toggleSort.emit('name')">
          {{ i18n.t('common.name') }}
          @if (sortField() === 'name') {
            <span class="sort-arrow">{{ sortDirection() === 'asc' ? '▲' : '▼' }}</span>
          }
        </button>
        <button type="button" class="col-sortable" (click)="toggleSort.emit('sourceType')">
          {{ i18n.t('common.type') }}
          @if (sortField() === 'sourceType') {
            <span class="sort-arrow">{{ sortDirection() === 'asc' ? '▲' : '▼' }}</span>
          }
        </button>
        <button type="button" class="col-sortable" (click)="toggleSort.emit('active')">
          {{ i18n.t('common.status') }}
          @if (sortField() === 'active') {
            <span class="sort-arrow">{{ sortDirection() === 'asc' ? '▲' : '▼' }}</span>
          }
        </button>
      </div>

      <div class="table-body ih-catalog-table-body ih-thin-scroll">
        @for (source of sources(); track source.id) {
          <button
            type="button"
            class="table-row ih-catalog-table-row"
            [class.table-row--selected]="selectedSourceId() === source.id"
            [class.ih-catalog-table-row--selected]="selectedSourceId() === source.id"
            (click)="selectSource.emit(source)"
          >
            <div class="row-primary ih-catalog-row-primary">
              <div class="row-avatar ih-catalog-row-avatar" [class]="presentation(source.sourceType).toneClass">
                <ih-icon [name]="presentation(source.sourceType).icon" [size]="20" />
              </div>
              <div class="row-copy ih-catalog-row-copy">
                <strong>{{ source.name }}</strong>
                <small>ID {{ source.id }}</small>
              </div>
            </div>

            <div class="row-type ih-catalog-row-meta">
              <mat-chip-set>
                <mat-chip>{{ source.sourceType }}</mat-chip>
              </mat-chip-set>
            </div>

            <div class="row-status" [class.row-status--inactive]="!source.active">
              <span class="status-dot"></span>
              {{ source.active ? i18n.t('status.active') : i18n.t('status.inactive') }}
            </div>
          </button>
        } @empty {
          <div class="empty-state ih-catalog-empty-state ih-muted">{{ i18n.t('sources.noData') }}</div>
        }
      </div>

      <mat-paginator
        class="list-paginator ih-catalog-paginator"
        [length]="totalLength()"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="pageSizeOptions()"
        [hidePageSize]="false"
        [showFirstLastButtons]="false"
        (page)="onPageChange($event)"
      />
    </div>
