<ih-catalog-list
  class="list-card"
  [columns]="columns"
  gridColumns="minmax(200px, 1.5fr) 0.9fr 0.8fr"
  [sortField]="sortField()"
  [sortDirection]="sortDirection()"
  [rowCount]="sources().length"
  [loading]="loading()"
  [error]="error()"
  emptyKey="sources.noData"
  emptyIcon="folder"
  [total]="totalLength()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="pageSizeOptions()"
  (toggleSort)="toggleSort.emit($event)"
  (pageChange)="onPageChange($event)"
  (retry)="retry.emit()"
>
  @for (source of sources(); track source.id) {
    <button
      type="button"
      class="table-row ih-catalog-table-row"
      [class.table-row--selected]="selectedSourceId() === source.id"
      [class.ih-catalog-table-row--selected]="selectedSourceId() === source.id"
      [attr.aria-label]="i18n.t('common.selectItem', { name: source.name })"
      [attr.tabindex]="$index === 0 ? 0 : -1"
      [attr.data-row-index]="$index"
      (click)="selectSource.emit(source)"
    >
      <div class="row-primary ih-catalog-row-primary">
        <div class="row-avatar ih-catalog-row-avatar" [class]="presentation(source.sourceType).toneClass">
          <ih-icon [name]="presentation(source.sourceType).icon" [size]="20" />
        </div>
        <div class="row-copy ih-catalog-row-copy">
          <strong>{{ source.name }}</strong>
          <small>ID {{ source.id }}</small>
        </div>
      </div>

      <div class="row-type ih-catalog-row-meta">
        <mat-chip-set>
          <mat-chip>{{ providerLabel(source.sourceType) }}</mat-chip>
        </mat-chip-set>
      </div>

      <div class="row-status" [class.row-status--inactive]="!source.active">
        <span class="status-dot" aria-hidden="true"></span>
        {{ source.active ? i18n.t('status.active') : i18n.t('status.inactive') }}
      </div>
    </button>
  }
</ih-catalog-list>
