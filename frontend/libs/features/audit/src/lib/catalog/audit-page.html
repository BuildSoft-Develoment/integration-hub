<section class="page-grid audit-page ih-catalog-grid">
  @let vm = viewModel();
  <mat-drawer-container class="audit-drawer-container ih-catalog-drawer-container">
    <mat-drawer-content>
      <section class="audit-workspace ih-catalog-workspace">
        <ih-audit-workspace-nav />

        <ih-audit-toolbar
          [search]="vm.search"
          [eventTypeFilter]="vm.eventTypeFilter"
          [statusFilter]="vm.statusFilter"
          [eventTypeOptions]="vm.eventTypeOptions"
          [loading]="vm.loading"
          (searchChange)="updateSearch($event)"
          (eventTypeFilterChange)="updateEventTypeFilter($event)"
          (statusFilterChange)="updateStatusFilter($event)"
          (refresh)="refresh()"
          (exportCsv)="exportCsv()"
          (exportJson)="exportJson()"
        />

        @if (vm.loading) {
          <mat-progress-bar mode="indeterminate" />
        }

        <section class="audit-list-shell ih-catalog-list-shell">
          <ih-audit-list
            [events]="vm.events"
            [totalLength]="vm.totalLength"
            [selectedEventId]="vm.selectedEvent?.id ?? null"
            [sortField]="vm.sortField"
            [sortDirection]="vm.sortDirection"
            [pageIndex]="vm.pageIndex"
            [pageSize]="vm.pageSize"
            (selectEvent)="selectEvent($event)"
            (toggleSort)="store.toggleSort($event)"
            (pageChange)="updatePagination($event)"
          />
        </section>
      </section>
    </mat-drawer-content>

    <mat-drawer class="audit-drawer ih-catalog-drawer" position="end" mode="over" [opened]="vm.drawerOpen" (closedStart)="closeDrawer()">
      <ih-audit-editor [event]="vm.selectedEvent" (close)="closeDrawer()" />
    </mat-drawer>
  </mat-drawer-container>
</section>
