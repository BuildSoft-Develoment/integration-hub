<ih-catalog-list
  class="list-card"
  [columns]="columns"
  gridColumns="minmax(200px, 1.5fr) 0.9fr 0.8fr"
  [sortField]="sortField()"
  [sortDirection]="sortDirection()"
  [rowCount]="events().length"
  [loading]="loading()"
  [error]="error()"
  emptyKey="audit.noData"
  emptyIcon="shield"
  [total]="totalLength()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="pageSizeOptions()"
  (toggleSort)="toggleSort.emit($event)"
  (pageChange)="onPageChange($event)"
  (retry)="retry.emit()"
>
  @for (event of events(); track event.id) {
    <button type="button" class="table-row ih-catalog-table-row" [class.table-row--selected]="selectedEventId() === event.id" [class.ih-catalog-table-row--selected]="selectedEventId() === event.id" [attr.aria-label]="eventLabel(event) + ' #' + event.id" [attr.tabindex]="$index === 0 ? 0 : -1" [attr.data-row-index]="$index" (click)="selectEvent.emit(event)">
      <div class="row-primary ih-catalog-row-primary">
        <div class="row-avatar ih-catalog-row-avatar ih-tone-document">
          <ih-icon name="shield" [size]="20" />
        </div>
        <div class="row-copy ih-catalog-row-copy">
          <strong>{{ eventLabel(event) }}</strong>
          <small>#{{ event.id }} · PE {{ event.processExecutionId ?? '-' }}</small>
          @if (event.taskType || event.taskDefinitionId != null) {
            <small class="row-task">{{ taskLabel(event) }}</small>
          }
        </div>
      </div>

      <div class="row-type ih-catalog-row-meta">
        <span class="status-pill" [class]="'status-pill status-pill--' + statusTone(event.status)">{{ statusLabel(event.status) }}</span>
      </div>

      <div class="row-status ih-catalog-row-meta"><time [attr.datetime]="event.createdAt" [title]="event.createdAt | ihTime:'absolute'" [attr.aria-label]="event.createdAt | ihTime:'absolute'">{{ event.createdAt | ihTime }}</time></div>
    </button>
  }
</ih-catalog-list>
