<div class="list-card ih-catalog-list">
      <div class="table-head ih-catalog-table-head">
        <button type="button" class="col-sortable" (click)="toggleSort.emit('eventType')">
          {{ i18n.t('audit.eventType') }}
          @if (sortField() === 'eventType') {
            <span class="sort-arrow">{{ sortDirection() === 'asc' ? '▲' : '▼' }}</span>
          }
        </button>
        <button type="button" class="col-sortable" (click)="toggleSort.emit('status')">
          {{ i18n.t('common.status') }}
          @if (sortField() === 'status') {
            <span class="sort-arrow">{{ sortDirection() === 'asc' ? '▲' : '▼' }}</span>
          }
        </button>
        <button type="button" class="col-sortable" (click)="toggleSort.emit('createdAt')">
          {{ i18n.t('audit.createdAt') }}
          @if (sortField() === 'createdAt') {
            <span class="sort-arrow">{{ sortDirection() === 'asc' ? '▲' : '▼' }}</span>
          }
        </button>
      </div>

      <div class="table-body ih-catalog-table-body ih-thin-scroll">
        @if (error(); as err) {
          <div class="ih-catalog-error" role="alert">
            <p class="ih-catalog-error__message">{{ i18n.t(err) }}</p>
            <button mat-stroked-button type="button" (click)="retry.emit()">{{ i18n.t('common.retry') }}</button>
          </div>
        }
        @if (loading()) {
          <ih-loading variant="skeleton" [rows]="pageSize()" />
        } @for (event of events(); track event.id) {
          <button type="button" class="table-row ih-catalog-table-row" [class.table-row--selected]="selectedEventId() === event.id" [class.ih-catalog-table-row--selected]="selectedEventId() === event.id" [attr.aria-label]="eventLabel(event) + ' #' + event.id" [attr.tabindex]="$index === 0 ? 0 : -1" [attr.data-row-index]="$index" (click)="selectEvent.emit(event)">
            <div class="row-primary ih-catalog-row-primary">
              <div class="row-avatar ih-catalog-row-avatar ih-tone-document">
                <ih-icon name="shield" [size]="20" />
              </div>
              <div class="row-copy ih-catalog-row-copy">
                <strong>{{ eventLabel(event) }}</strong>
                <small>#{{ event.id }} · PE {{ event.processExecutionId ?? '-' }}</small>
                @if (event.taskType || event.taskDefinitionId != null) {
                  <small class="row-task">{{ taskLabel(event) }}</small>
                }
              </div>
            </div>

            <div class="row-type ih-catalog-row-meta">
              <mat-chip-set>
                <mat-chip [class]="statusChipClass(event.status)">{{ statusLabel(event.status) }}</mat-chip>
              </mat-chip-set>
            </div>

            <div class="row-status ih-catalog-row-meta"><time [attr.datetime]="event.createdAt" [title]="event.createdAt | ihTime:'absolute'" [attr.aria-label]="event.createdAt | ihTime:'absolute'">{{ event.createdAt | ihTime }}</time></div>
          </button>
        } @empty {
          <div class="empty-state ih-catalog-empty-state">
            <ih-icon name="shield" [size]="32" />
            <p class="ih-muted">{{ i18n.t('audit.noData') }}</p>
          </div>
        }
      </div>

      @if (totalLength() > 0) {
        <mat-paginator class="list-paginator ih-catalog-paginator" [length]="totalLength()" [pageIndex]="pageIndex()" [pageSize]="pageSize()" [pageSizeOptions]="pageSizeOptions()" [hidePageSize]="false" [showFirstLastButtons]="false" (page)="onPageChange($event)" />
      }
    </div>
