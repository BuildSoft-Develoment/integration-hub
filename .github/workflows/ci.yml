name: CI

# DISPARADORES: las ramas nombradas aqui TIENEN QUE EXISTIR. No es una obviedad, es la leccion mas
# cara de este fichero: apuntaba a `main` y `develop` cuando no existian, asi que el workflow no se
# ejecuto NUNCA y los gates que la documentacion de las fases 4, 5, 6 y 7 cita como control no
# controlaban nada. 23 dias de cambios estructurales derivaron sin que saltara una alarma. El fallo
# es SILENCIOSO: no hay error, solo ausencia de ejecuciones, que se parece mucho a "todo va bien".
#
# 2026-08-17: ahora si existen. `main` y `develop` se crearon ANTES de tocar esta linea, en ese
# orden y a proposito. Al modificar este bloque, comprobar con `git branch -r` primero.
#
# Las ramas de trabajo ya no se listan: entran por pull_request contra main o develop, que es donde
# el gate decide algo. Lanzar CI en cada push de cada rama personal gasta minutos sin decidir nada.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Permite lanzarlo a mano sobre cualquier rama sin esperar a un push.
  workflow_dispatch:

jobs:
  governance:
    name: Gobernanza AI-first (check:all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificaciones del framework y del proyecto
        run: npm run check:all

  backend-fast:
    name: Backend Quarkus fast (build + test + IT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Carril rapido para PR: excluye perf y compat-db.
      #
      # PR-4: antes usaba `-pl platform-app -am`. `-am` arrastra las DEPENDENCIAS de platform-app,
      # y audit-consumer es un modulo HERMANO, no una dependencia: sus tests -incluido
      # AuditConsumerKafkaBatchIT- no se ejecutaban nunca. Se construye el reactor completo, que
      # ademas es lo unico que ejercita los ITs del vertical del money-path.
      - name: Maven verify (fast)
        run: mvn -B -Pfast-tests verify

# El carril compat-db (matriz Oracle / SQL Server / MySQL / PostgreSQL) vive ahora en su propio
# workflow, ci-compat-db.yml, filtrado por `paths`: es el mas caro del pipeline y en produccion se sale
# por PostgreSQL salvo peticion expresa, asi que solo tiene sentido cuando el cambio toca la capa de
# datos. Se separo en vez de gatearlo con un `if:` porque `paths` es nativo y evaluable de un vistazo.

  frontend:
    name: Frontend Angular (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      # `nx test web` descubre y corre los specs de apps/web + libs/** (76 tests).
      # El builder @angular/build:unit-test globa desde projectSourceRoot, por eso el
      # target usa sourceRoot "." + index.html explicito en build (ver apps/web/project.json).
      # Lintea app + las 18 libs registradas como projects Nx. Las fronteras de modulo (feature no importa
      # feature; capas bajas no importan features) las impone @nx/enforce-module-boundaries por tag
      # (depConstraints en eslint.config.mjs), reemplazando el guard manual `lint:boundaries` (retirado).
      - name: Lint (app + libs, con fronteras de modulo Nx)
        working-directory: frontend
        run: npx nx run-many -t lint
      - name: Plugin catalog gate
        working-directory: frontend
        run: npx nx run web:test-plugins
      - name: Unit tests
        working-directory: frontend
        run: npx nx test web
      - name: Build
        working-directory: frontend
        run: npx nx build web
