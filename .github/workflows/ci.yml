name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  governance:
    name: Gobernanza AI-first (check:all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificaciones del framework y del proyecto
        run: npm run check:all

  backend:
    name: Backend Quarkus (build + test + IT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # `verify` corre tests unitarios (surefire) y de integracion *IT (failsafe).
      # Los *IT usan Testcontainers (Postgres) -> requieren Docker (disponible en ubuntu-latest).
      - name: Maven verify
        working-directory: platform-app
        run: ./mvnw -B verify

  frontend:
    name: Frontend Angular (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      # `nx test web` descubre y corre los specs de apps/web + libs/** (76 tests).
      # El builder @angular/build:unit-test globa desde projectSourceRoot, por eso el
      # target usa sourceRoot "." + index.html explicito en build (ver apps/web/project.json).
      - name: Lint
        working-directory: frontend
        run: npx nx lint web
      # Fronteras de modulo: las libs (core/*, shared/*, features/*, plugin-ui-kit) NO son projects Nx, asi que
      # `nx lint web` no las gobierna. Este es el UNICO enforcement de la direccion de dependencias por import
      # (feature no importa feature; capas bajas no importan features). Va tras Lint y antes de test/build para
      # fallar en segundos ante una violacion. Ver revisiones/2026-07-06-analisis-lint-boundaries-en-ci.md.
      - name: Boundaries (direccion de dependencias de modulo)
        working-directory: frontend
        run: npm run lint:boundaries
      - name: Plugin catalog gate
        working-directory: frontend
        run: npx nx run web:test-plugins
      - name: Unit tests
        working-directory: frontend
        run: npx nx test web
      - name: Build
        working-directory: frontend
        run: npx nx build web
