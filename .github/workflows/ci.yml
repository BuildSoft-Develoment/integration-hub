name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  governance:
    name: Gobernanza AI-first (check:all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificaciones del framework y del proyecto
        run: npm run check:all

  backend-fast:
    name: Backend Quarkus fast (build + test + IT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Carril rapido para PR: compila dependencias desde la raiz y excluye perf/compat-db.
      - name: Maven verify (fast)
        run: mvn -B -pl platform-app -am -Pfast-tests verify

  backend-compat-db:
    name: Backend Quarkus compat-db (multi-motor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Carril dedicado a la matriz multi-BD: Oracle, PostgreSQL, SQL Server y MySQL.
      - name: Maven test (compat-db)
        run: mvn -B -pl platform-app -am -Pcompat-db-tests test

  frontend:
    name: Frontend Angular (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      # `nx test web` descubre y corre los specs de apps/web + libs/** (76 tests).
      # El builder @angular/build:unit-test globa desde projectSourceRoot, por eso el
      # target usa sourceRoot "." + index.html explicito en build (ver apps/web/project.json).
      # Lintea app + las 18 libs registradas como projects Nx. Las fronteras de modulo (feature no importa
      # feature; capas bajas no importan features) las impone @nx/enforce-module-boundaries por tag
      # (depConstraints en eslint.config.mjs), reemplazando el guard manual `lint:boundaries` (retirado).
      - name: Lint (app + libs, con fronteras de modulo Nx)
        working-directory: frontend
        run: npx nx run-many -t lint
      - name: Plugin catalog gate
        working-directory: frontend
        run: npx nx run web:test-plugins
      - name: Unit tests
        working-directory: frontend
        run: npx nx test web
      - name: Build
        working-directory: frontend
        run: npx nx build web
