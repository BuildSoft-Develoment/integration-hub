name: CI

# DISPARADORES: las ramas nombradas aqui TIENEN QUE EXISTIR. No es una obviedad, es la leccion mas
# cara de este fichero: apuntaba a `main` y `develop` cuando no existian, asi que el workflow no se
# ejecuto NUNCA y los gates que la documentacion de las fases 4, 5, 6 y 7 cita como control no
# controlaban nada. 23 dias de cambios estructurales derivaron sin que saltara una alarma. El fallo
# es SILENCIOSO: no hay error, solo ausencia de ejecuciones, que se parece mucho a "todo va bien".
#
# 2026-08-17: ahora si existen. `main` y `develop` se crearon ANTES de tocar esta linea, en ese
# orden y a proposito. Al modificar este bloque, comprobar con `git branch -r` primero.
#
# Las ramas de trabajo ya no se listan: entran por pull_request contra main o develop, que es donde
# el gate decide algo. Lanzar CI en cada push de cada rama personal gasta minutos sin decidir nada.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Permite lanzarlo a mano sobre cualquier rama sin esperar a un push.
  workflow_dispatch:

jobs:
  governance:
    name: Gobernanza AI-first (check:all)
    # NO SE REPITE EN EL PUSH A DEVELOP. Ese arbol es el que el pull request acaba de validar,
    # asi que volver a correrlo gasta ~20 min de runner por fusion sin decir nada nuevo. Con dos
    # ejecuciones por merge, los minutos de Actions se agotan al doble de velocidad.
    #
    # EN EL PUSH A MAIN SI SE REPITE, a proposito. Un pull request valida la mezcla contra la base
    # que habia AL ABRIRLO; si la base se movio entre medias, el commit que aterriza no lo ha
    # probado nadie —dos PR que pasan por separado pueden romperse al juntarse—. En main eso
    # importa, porque es lo que se taggea y se despliega, y ademas alli las fusiones son pocas.
    # En develop no compensa pagarlo en cada merge.
    #
    # El job de abajo, `guard-pull-request`, corre SOLO en push y no lleva esta condicion: es el
    # que detecta que alguien empujo directo saltandose el PR. Si tambien se saltara, empujar a
    # develop dejaria de disparar absolutamente nada.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # La memoria viva es una BD SQLite gitignorada: no viaja en el repositorio, se CONSTRUYE
      # indexando la documentacion. Diez de los 52 gates la leen —trazabilidad, evidencias,
      # coherencia de estados, tablas y endpoints documentados— y sin ella no fallan por lo que
      # miden: fallan porque no encuentran la BD.
      #
      # Silenciarlos habria sido lo facil y lo peor: este mismo fichero documenta lo que cuesta
      # tener gates que no gatean. Construida, los diez pasan con sustancia — 255 enlaces de
      # trazabilidad, 417 evidencias, 419 estados coherentes— o sea que estaban midiendo algo.
      #
      # Variante `:quick` a proposito: la completa ademas calcula embeddings, que en CI no aporta
      # a ningun gate y cuesta tiempo.
      - name: Construir la memoria viva (la leen 10 de los gates)
        run: npm run memory:bootstrap:quick
      - name: Verificaciones del framework y del proyecto
        run: npm run check:all

  # ---------------------------------------------------------------------------------
  # Detecta commits que llegaron a main o develop SIN pasar por un pull request.
  #
  # POR QUE ESTO EXISTE, EN LUGAR DE UNA PROTECCION DE RAMA
  # GitHub NO aplica rulesets ni protecciones clasicas en repositorios privados de este
  # plan. Comprobado empujando a main a proposito: el push directo paso, y el force push
  # tambien. O sea que hoy nada IMPIDE saltarse el modelo de ramas.
  #
  # Este job no lo impide tampoco —no puede— pero lo hace RUIDOSO: el commit queda con
  # una equis roja y el motivo escrito. La diferencia entre un descuido que nadie ve y
  # un acto deliberado que queda registrado.
  #
  # Se retira el dia que las protecciones se apliquen de verdad: entonces sobra, porque
  # el push ni siquiera llegaria a ocurrir.
  # ---------------------------------------------------------------------------------
  guard-pull-request:
    name: Integracion por pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Comprobar que el commit llego por pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # La API dice que pull requests contienen este commit. Un merge de PR devuelve
          # al menos uno; un push directo devuelve cero.
          asociados=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length')
          if [ "$asociados" -gt 0 ]; then
            echo "OK. El commit llego por pull request."
            exit 0
          fi
          echo "::error::Este commit se empujo DIRECTO a ${{ github.ref_name }}, sin pull request."
          echo ""
          echo "Los cuatro gates de CI corren igual, pero nadie los reviso antes de integrar:"
          echo "esa es justo la diferencia que un pull request aporta."
          echo ""
          echo "Si fue un descuido, el arreglo NO es rehacer la historia: es abrir el"
          echo "siguiente cambio como pull request. Si fue deliberado, queda constancia."
          exit 1

  backend-fast:
    name: Backend Quarkus fast (build + test + IT)
    # Mismo motivo que en `governance`: el PR ya valido este arbol.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Carril rapido para PR: excluye perf y compat-db.
      #
      # PR-4: antes usaba `-pl platform-app -am`. `-am` arrastra las DEPENDENCIAS de platform-app,
      # y audit-consumer es un modulo HERMANO, no una dependencia: sus tests -incluido
      # AuditConsumerKafkaBatchIT- no se ejecutaban nunca. Se construye el reactor completo, que
      # ademas es lo unico que ejercita los ITs del vertical del money-path.
      - name: Maven verify (fast)
        run: mvn -B -Pfast-tests verify

# El carril compat-db (matriz Oracle / SQL Server / MySQL / PostgreSQL) vive ahora en su propio
# workflow, ci-compat-db.yml, filtrado por `paths`: es el mas caro del pipeline y en produccion se sale
# por PostgreSQL salvo peticion expresa, asi que solo tiene sentido cuando el cambio toca la capa de
# datos. Se separo en vez de gatearlo con un `if:` porque `paths` es nativo y evaluable de un vistazo.

  frontend:
    name: Frontend Angular (lint + test + build)
    # Mismo motivo que en `governance`: el PR ya valido este arbol.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      # `nx test web` descubre y corre los specs de apps/web + libs/** (76 tests).
      # El builder @angular/build:unit-test globa desde projectSourceRoot, por eso el
      # target usa sourceRoot "." + index.html explicito en build (ver apps/web/project.json).
      # Lintea app + las 18 libs registradas como projects Nx. Las fronteras de modulo (feature no importa
      # feature; capas bajas no importan features) las impone @nx/enforce-module-boundaries por tag
      # (depConstraints en eslint.config.mjs), reemplazando el guard manual `lint:boundaries` (retirado).
      - name: Lint (app + libs, con fronteras de modulo Nx)
        working-directory: frontend
        run: npx nx run-many -t lint
      - name: Plugin catalog gate
        working-directory: frontend
        run: npx nx run web:test-plugins
      - name: Unit tests
        working-directory: frontend
        run: npx nx test web
      - name: Build
        working-directory: frontend
        run: npx nx build web
