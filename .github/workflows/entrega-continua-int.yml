# =====================================================================================
# ENTREGA CONTINUA A INTEGRACION. Cada fusion en develop que toque codigo publica una imagen
# y la despliega en el servidor de integracion on-premise.
#
# HASTA INTEGRACION, Y NO MAS. Produccion sigue disparandose a mano (ADR-029, R5): con una
# sola maquina, migraciones de Flyway que corren al arrancar y un rollback que no es simetrico,
# automatizar el ultimo salto quitaria al unico humano que hoy mira antes de que el cambio
# toque el camino del dinero. Aqui abajo, en cambio, automatizarlo es justo lo que hace util
# el entorno: integracion queda siempre en la cabeza de develop, y ese binario es el mismo que
# despues se promueve a la nube.
#
# NO DUPLICA NADA. Llama a los dos workflows que ya existen —publicar y desplegar—, asi que si
# alguno cambia, cambia en un solo sitio y este lo hereda.
# =====================================================================================
name: Entrega continua a integracion

on:
  push:
    branches: [develop]

    # LA LISTA ES DE RUTAS INERTES, NO DE RUTAS DE CODIGO. Enumerar el codigo obliga a acordarse
    # de esta lista cada vez que nace un modulo, y el dia que alguien no se acuerde su cambio se
    # publica sin desplegarse —o peor, no se publica y se despliega una imagen vieja creyendo que
    # esta al dia—. Al reves, lo peor que pasa es compilar de mas.
    #
    # Ojo con lo que NO esta: `frontend/` dispara igual, porque Quinoa compila el SPA DENTRO de
    # platform-app. Filtrar por "platform-app/ y audit-consumer/" habria dejado fuera los cambios
    # de frontend y los de los modulos compartidos, que tambien cambian el binario.
    #
    # Aqui `paths-ignore` es seguro, al contrario que en ci.yml: alli un check que no existe deja
    # colgado a un ruleset que lo exija, y por eso los jobs tienen que existir y reportarse como
    # omitidos. Este workflow no es un check de pull request y nadie lo va a exigir.
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "ai/**"
      - "qa/**"
      - "ops/**"
      - "*.md"

# Dos fusiones seguidas en develop no pueden desplegar a la vez sobre la misma maquina. Y no se
# cancela la que este en curso: abortar a mitad de un `up -d` deja el entorno a medio camino.
concurrency:
  group: entrega-continua-integracion
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Publicar imagenes
    uses: ./.github/workflows/publish-vm-images.yml

  desplegar:
    name: Desplegar en integracion
    needs: publicar
    uses: ./.github/workflows/deploy-int.yml
    with:
      # El tag EXACTO que acaba de publicarse, tomado del workflow que lo calculo. Recalcularlo
      # aqui seria un error silencioso: `github.sha` es el SHA completo y el tag es el corto.
      image_tag: ${{ needs.publicar.outputs.tag }}
      git_ref: develop
