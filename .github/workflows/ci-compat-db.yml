name: CI compat-db (multi-motor)

# Matriz de compatibilidad multi-motor: Oracle, SQL Server, MySQL y PostgreSQL. Es el carril mas caro y
# lento del pipeline -levanta cuatro contenedores de base de datos, y solo la imagen de Oracle pesa
# ~6,5 GB-, asi que no corre en cada push.
#
# Criterio: en produccion se sale por PostgreSQL salvo peticion expresa del cliente, de modo que la
# matriz solo aporta informacion cuando el cambio toca la capa de datos. Se filtra con `paths` nativo en
# vez de un `if:` dentro del job: `paths` se evalua de un vistazo y no admite el fail-open de una
# condicion mal escrita, mientras que un job saltado por `if` aparece como "success" en la PR y puede
# confundirse con un carril que corrio.
#
# Si hace falta lanzarlo sobre un cambio que no encaje en los paths, esta workflow_dispatch.
on:
  push:
    branches: [master, 'experiment/**']
    paths:
      - '**/src/main/resources/db/migration/**'
      - '**/src/main/resources/db/migration-mt101/**'
      - '**/repository/**'
      - '**/provider/task/dbwrite/**'
      - '**/provider/task/dbfunction/**'
      - '**/provider/task/storedprocedure/**'
      - '**/entity/**'
      - '**/spi/task/support/**'
      - '**/*Compatibility*.java'
      - '**/*.sql'
      - 'pom.xml'
      - '**/pom.xml'
      - '.github/workflows/ci-compat-db.yml'
  pull_request:
    branches: [master]
    paths:
      - '**/src/main/resources/db/migration/**'
      - '**/src/main/resources/db/migration-mt101/**'
      - '**/repository/**'
      - '**/provider/task/dbwrite/**'
      - '**/provider/task/dbfunction/**'
      - '**/provider/task/storedprocedure/**'
      - '**/entity/**'
      - '**/spi/task/support/**'
      - '**/*Compatibility*.java'
      - '**/*.sql'
      - 'pom.xml'
      - '**/pom.xml'
      - '.github/workflows/ci-compat-db.yml'
  workflow_dispatch:

jobs:
  backend-compat-db:
    name: Backend Quarkus compat-db (multi-motor)
    runs-on: ubuntu-latest
    # Oracle tarda varios minutos solo en arrancar; el default de 6 h es innecesariamente permisivo y
    # dejaria un runner colgado consumiendo cuota si un contenedor no levanta.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # forkCount=1: con paralelismo de forks, los cuatro motores compiten por CPU y memoria y aparecen
      # fallos que NO son del codigo (timeouts de arranque, ORA-12514). Medido en local: con -T1C daba
      # 11 errores y con forkCount=3 daba 3; con forkCount=1, cero.
      - name: Maven test (compat-db)
        run: mvn -B -Pcompat-db-tests test -DforkCount=1
