name: CI compat-db (multi-motor)

# Matriz de compatibilidad multi-motor: Oracle, SQL Server, MySQL y PostgreSQL. Es el carril mas caro y
# lento del pipeline -levanta cuatro contenedores de base de datos, y solo la imagen de Oracle pesa
# ~6,5 GB-, asi que no corre en cada push.
#
# Criterio: en produccion se sale por PostgreSQL salvo peticion expresa del cliente, de modo que la
# matriz solo aporta informacion cuando el cambio toca la capa de datos. Se filtra con `paths` nativo en
# vez de un `if:` dentro del job: `paths` se evalua de un vistazo y no admite el fail-open de una
# condicion mal escrita, mientras que un job saltado por `if` aparece como "success" en la PR y puede
# confundirse con un carril que corrio.
#
# Si hace falta lanzarlo sobre un cambio que no encaje en los paths, esta workflow_dispatch.
on:
  push:
    branches: [main, develop]
    paths:
      - '**/src/main/resources/db/migration/**'
      - '**/src/main/resources/db/migration-mt101/**'
      - '**/repository/**'
      - '**/provider/task/dbwrite/**'
      - '**/provider/task/dbfunction/**'
      - '**/provider/task/storedprocedure/**'
      - '**/entity/**'
      - '**/spi/task/support/**'
      - '**/*Compatibility*.java'
      - '**/*.sql'
      - 'pom.xml'
      - '**/pom.xml'
      - '.github/workflows/ci-compat-db.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/src/main/resources/db/migration/**'
      - '**/src/main/resources/db/migration-mt101/**'
      - '**/repository/**'
      - '**/provider/task/dbwrite/**'
      - '**/provider/task/dbfunction/**'
      - '**/provider/task/storedprocedure/**'
      - '**/entity/**'
      - '**/spi/task/support/**'
      - '**/*Compatibility*.java'
      - '**/*.sql'
      - 'pom.xml'
      - '**/pom.xml'
      - '.github/workflows/ci-compat-db.yml'
  workflow_dispatch:

jobs:
  backend-compat-db:
    name: Backend Quarkus compat-db (multi-motor)
    runs-on: ubuntu-latest
    # Oracle tarda varios minutos solo en arrancar; el default de 6 h es innecesariamente permisivo y
    # dejaria un runner colgado consumiendo cuota si un contenedor no levanta.
    timeout-minutes: 60
    steps:
      # SIN --depth. La clase de rollback sale de una comparacion de TRES PUNTOS contra la base, y
      # esa necesita un antepasado comun: con el clon superficial muere con "no merge base". Es el
      # mismo tropiezo que ya costo un pull request bloqueado en ci.yml.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ADR-030 D4/D7. Se pone ANTES de la matriz multi-motor a proposito: tarda segundos y responde
      # la pregunta que mas caro sale tarde —si esta release se puede retroceder—, mientras que la
      # matriz tarda decenas de minutos. Si el pase es de clase C sin script de bajada, no merece la
      # pena arrancar cuatro motores para averiguar lo demas.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clase de rollback del pase (ADR-030 D4)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          if [ -z "${BASE:-}" ]; then
            echo "Fuera de un pull request no hay base contra la que comparar: se omite."
            exit 0
          fi
          git fetch -q origin "$BASE"
          node ci/scripts/check-rollback-class.mjs --desde "origin/$BASE" --hasta HEAD --strict

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Un solo fork: con paralelismo, los cuatro motores compiten por CPU y memoria y aparecen fallos
      # que NO son del codigo (timeouts de arranque, ORA-12514). Medido en local: con -T1C daba 11
      # errores y con forkCount=3 daba 3; con un unico fork, cero.
      #
      # El flag era `-DforkCount=1` y era INERTE. Surefire declara el parametro en el POM como
      # <forkCount>${test.fork.count}</forkCount>, y una configuracion explicita de plugin gana sobre
      # la user property homonima: verificado con `help:effective-pom -DforkCount=99`, que sigue
      # resolviendo a 1. La propiedad que hay que fijar es `test.fork.count`.
      #
      # Hoy el comportamiento no cambia -el POM ya la trae a 1 por defecto-, pero el flag anterior
      # daba una garantia que no existia: si alguien subiera ese valor por defecto para acelerar el
      # carril rapido, la matriz multi-motor habria empezado a fallar por contencion, con el workflow
      # afirmando por escrito que estaba protegida.
      - name: Maven test (compat-db)
        run: mvn -B -Pcompat-db-tests test -Dtest.fork.count=1
