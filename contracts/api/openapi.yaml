openapi: 3.0.3
info:
  title: API consolidada (generado por scripts/generate-openapi.mjs)
  version: 1.0.0
  description: |
    Este archivo es generado automaticamente desde los api-contract.md
    de cada specs/<feature>/. NO editar a mano — perdera los cambios al
    proximo `npm run generate:openapi`.
    Features fuente: 001-catalogo-fuentes, 002-catalogo-readers, 003-diseno-y-ejecucion-procesos, 004-observabilidad-y-auditoria, 005-catalogo-conexiones, 006-programacion-procesos, 007-tema-del-sistema
servers:
  - url: /
paths:
  /api/source-definitions:
    get:
      summary: Lista las fuentes configuradas
      operationId: listSourceDefinitions
      responses:
        '200':
          description: OK
      x-source-feature: "001-catalogo-fuentes"
    post:
      summary: Crea una fuente
      operationId: createSourceDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceDefinition"
      responses:
        '200':
          description: OK
      x-source-feature: "001-catalogo-fuentes"
  /api/source-definitions/test:
    post:
      summary: Prueba una fuente
      operationId: testSourceDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceDefinition"
      responses:
        '200':
          description: OK
      x-source-feature: "001-catalogo-fuentes"
  /api/source-definitions/{sourceDefinitionId}:
    put:
      summary: Actualiza una fuente
      operationId: updateSourceDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceDefinition"
      responses:
        '200':
          description: OK
      x-source-feature: "001-catalogo-fuentes"
  /api/source-definitions/{sourceDefinitionId}/activation/{active}:
    post:
      summary: Activa o desactiva una fuente
      operationId: setSourceDefinitionActive
      requestBody:
        required: false
        description: Sin cuerpo; el estado se indica en la ruta ({active}). Se referencia el recurso afectado por completitud del contrato.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceDefinition"
      responses:
        '200':
          description: OK
      x-source-feature: "001-catalogo-fuentes"
  /api/reader-definitions:
    get:
      summary: Lista los readers configurados
      operationId: listReaderDefinitions
      responses:
        '200':
          description: OK
      x-source-feature: "002-catalogo-readers"
    post:
      summary: Crea un reader
      operationId: createReaderDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderDefinition"
      responses:
        '200':
          description: OK
      x-source-feature: "002-catalogo-readers"
  /api/reader-definitions/{readerDefinitionId}:
    put:
      summary: Actualiza un reader
      operationId: updateReaderDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderDefinition"
      responses:
        '200':
          description: OK
      x-source-feature: "002-catalogo-readers"
  /api/reader-definitions/{readerDefinitionId}/activation/{active}:
    post:
      summary: Activa o desactiva un reader
      operationId: setReaderDefinitionActive
      requestBody:
        required: false
        description: Sin cuerpo; el estado se indica en la ruta ({active}). Se referencia el recurso afectado por completitud del contrato.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderDefinition"
      responses:
        '200':
          description: OK
      x-source-feature: "002-catalogo-readers"
  /api/process-definitions:
    get:
      summary: Lista los procesos definidos
      operationId: listProcessDefinitions
      responses:
        '200':
          description: OK
      x-source-feature: "003-diseno-y-ejecucion-procesos"
    post:
      summary: Crea un proceso
      operationId: createProcessDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessDefinition"
      responses:
        '200':
          description: OK
      x-source-feature: "003-diseno-y-ejecucion-procesos"
  /api/process-definitions/{processDefinitionId}:
    put:
      summary: Actualiza un proceso
      operationId: updateProcessDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessDefinition"
      responses:
        '200':
          description: OK
      x-source-feature: "003-diseno-y-ejecucion-procesos"
  /api/process-definitions/{processDefinitionId}/activation/{active}:
    post:
      summary: Activa o desactiva un proceso
      operationId: setProcessDefinitionActive
      requestBody:
        required: false
        description: Sin cuerpo; el estado se indica en la ruta ({active}). Se referencia el recurso afectado por completitud del contrato.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessDefinition"
      responses:
        '200':
          description: OK
      x-source-feature: "003-diseno-y-ejecucion-procesos"
