      summary: Obtiene la configuracion de tema del sistema
      operationId: getSystemTheme
      responses:
        '200':
          description: OK
      x-source-feature: "007-tema-del-sistema"
    put:
      summary: Actualiza la configuracion de tema del sistema
      operationId: updateSystemTheme
      requestBody:
        required: true
