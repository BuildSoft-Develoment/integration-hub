          application/json:
            schema:
              $ref: "#/components/schemas/SystemThemeSetting"
      responses:
        '200':
          description: OK
      x-source-feature: "007-tema-del-sistema"

components:
  schemas:
    SourceDefinition:
      type: object
      required:
        - id
        - name
        - sourceType
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sourceType:
          type: string
        active:
          type: boolean
        configurationJson:
          type: string
    ReaderDefinition:
      type: object
      required:
        - id
        - name
        - readerType
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        readerType:
          type: string
        active:
          type: boolean
        configurationJson:
          type: string
    ProcessDefinition:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
    ProcessExecution:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required:
        - id
        - eventType
      properties:
        id:
          type: integer
          format: int64
        eventType:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    ConnectionDefinition:
      type: object
      required:
        - id
        - name
        - connectionType
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        connectionType:
          type: string
        active:
          type: boolean
        configurationJson:
          type: string
    ProcessSchedule:
      type: object
      required:
        - processDefinitionId
        - scheduled
      properties:
        processDefinitionId:
          type: integer
          format: int64
        scheduled:
          type: boolean
        scheduleEvery:
          type: string
        nextRunAt:
          type: string
          format: date-time
        lastRunAt:
          type: string
          format: date-time
    SystemThemeSetting:
      type: object
      required:
        - scheme
      properties:
        scheme:
          type: string
        preset:
          type: string
        density:
          type: string
        primaryColor:
          type: string
        errorColor:
          type: string
        neutralColor:
          type: string
        locale:
          type: string
        sidebarMode:
          type: string
