components:
  schemas:
    SourceDefinition:
      type: object
      required:
        - id
        - name
        - sourceType
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sourceType:
          type: string
        active:
          type: boolean
        configurationJson:

    ReaderDefinition:
      type: object
      required:
        - id
        - name
        - readerType
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        readerType:
          type: string
        active:
          type: boolean
        configurationJson:

    ProcessDefinition:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        active:

    ProcessExecution:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required:
        - id
        - eventType
      properties:
        id:
          type: integer
          format: int64
        eventType:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    AuditSpoolSummary:
      type: object
      properties:
        pending:
          type: integer
        inFlight:
          type: integer
        sent:
          type: integer
        dead:
          type: integer
        oldestPendingCreatedAt:
          type: string
          format: date-time
    AuditSpoolEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: string
        traceId:
          type: string
        spoolStatus:
          type: string
        attempts:
          type: integer
        deadReason:
          type: string
    Mt101FragmentLink:
      type: object
      properties:
        fragmentSetId:
          type: string
        processExecutionId:
          type: integer
          format: int64
        sourceTable:
          type: string
        sourceRowFrom:
          type: integer
          format: int64
        sourceRowTo:
          type: integer
          format: int64
        sendersReference:
          type: string
        status:

    ConnectionDefinition:
      type: object
      required:
        - id
        - name
        - connectionType
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        connectionType:
          type: string
        active:
          type: boolean
        configurationJson:

    ProcessSchedule:
      type: object
      required:
        - processDefinitionId
        - scheduled
      properties:
        processDefinitionId:
          type: integer
          format: int64
        scheduled:
          type: boolean
        scheduleEvery:
          type: string
        nextRunAt:
          type: string
          format: date-time
        lastRunAt:
          type: string
    SystemThemeSetting:
      type: object
      required:
        - scheme
      properties:
        scheme:
          type: string
        preset:
          type: string
        density:
          type: string
        primaryColor:
          type: string
        errorColor:
          type: string
        neutralColor:
          type: string
        locale:
          type: string
        sidebarMode:

